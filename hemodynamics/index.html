:"PRELOAD POUCH",color:"#42a5f5",bg:"rgba(66,165,245,0.09)",tagline:"How FULL is the ventricle before it squeezes?",definition:"Preload is the degree of myocardial fiber stretch at end-diastole \u2014 the volume load placed on the ventricle just before contraction. Think of it as how much you fill a water balloon before you squeeze it. More stretch = more recoil force, up to a point (Frank-Starling Law). Beyond the optimal stretch point, overfilling the balloon causes it to lose shape and generate less effective force.",physiology:"At the cellular level, preload determines how much overlap exists between actin and myosin filaments. Optimal overlap = maximum cross-bridge formation = maximum force. Too little volume = too little overlap. Too much = filaments over-stretched, cross-bridges disengage, force drops. This is the Frank-Starling relationship \u2014 the myocardium is its own volume sensor.",measure:[["CVP (Central Venous Pressure)","2\u20138 mmHg","Reflects RV preload. Assessed via PA proximal port or CVL. Elevated in RV failure, tamponade, fluid overload. Low in hypovolemia."],["PA Diastolic","8\u201315 mmHg","Reflects LV filling indirectly (pulmonary venous return). Used at THHBD as surrogate for LV preload without wedging."],["PCWP / Wedge","8\u201312 mmHg","Direct LV preload estimate. Rarely used at THHBD \u2014 educational/boards context only."],["Clinical signs","\u2014","Flat neck veins, dry mucous membranes, poor skin turgor = low preload. Distended neck veins, crackles, S3 = high preload."]],tools:[{name:"IV Crystalloids",type:"\u2191 Preload",detail:"NS, LR \u2014 rapid volume expansion. First choice for hypovolemia. Large volumes (> 3L) \u2192 dilutional coagulopathy + capillary leak. Use judiciously post-CPB."},{name:"PRBCs",type:"\u2191 Preload + O\u2082 carry",detail:"Expands intravascular volume AND improves O\u2082 delivery. Preferred when Hgb < 7\u20138 or anemia is contributing to LCOS."},{name:"Albumin 5%/25%",type:"\u2191 Preload (colloid)",detail:"Oncotic pressure support. Useful when capillary leak state exists (post-CPB inflammation). 25% draws fluid from interstitium into vasculature."},{name:"Passive Leg Raise",type:"\u2191 Preload (reversible)",detail:"Autotransfusion of 300\u2013500 mL from lower extremities. Instantaneous and reversible \u2014 excellent preload responsiveness test before committing volume."},{name:"Diuretics (Furosemide)",type:"\u2193 Preload",detail:"Venodilation + renal excretion \u2192 \u2193 filling pressures. Used for flash pulmonary edema, RV failure with elevated CVP, fluid overload post-CPB."},{name:"NTG (Low dose)",type:"\u2193 Preload",detail:"Venodilator at doses < 50 mcg/min \u2192 \u2193 venous return \u2192 \u2193 preload. Used for CHF, pulmonary edema, LCOS with high filling pressures."}],surgery:[{proc:"CABG",txt:"Fresh CABG patients often have depleted intravascular volume from CPB priming, insensible losses, and third-spacing. Low CVP on arrival is common. Fluid responsiveness test (PLR or CVP response to 250 mL bolus) before committing volume. Avoid fluid overload \u2014 CPB-induced capillary leak makes it hard to get fluid back out."},{proc:"AVR (Aortic Stenosis)",txt:"AS patients have massively hypertrophied, stiff LVs. They NEED higher preload (CVP 10\u201314) to fill an inelastic chamber. Losing preload rapidly (aggressive diuresis, NTG) drops CO precipitously. 'Preload-sensitive' is the defining management principle."},{proc:"AVR (Aortic Regurgitation)",txt:"Chronic AR causes volume overload and LV dilation. After valve replacement, the regurgitant volume is gone \u2014 LV is suddenly 'smaller' relative to its dilated state. Preload management normalizes over days. Avoid aggressive volume loading early."},{proc:"MVR / MV Repair",txt:"Chronic MR = volume overload to LV via regurgitant fraction. Post-repair, the LA 'escape valve' is gone. RV now faces full pulmonary venous return. Monitor CVP vs PA pressures: CVP rising >> PA diastolic = RV failing from volume/pressure overload. STOP fluids."}]},{id:"contractility",icon:"\u26A1",label:"CONTRACTILITY POUCH",color:"#00e676",bg:"rgba(0,230,118,0.07)",tagline:"How HARD does the ventricle squeeze?",definition:"Contractility (inotropy) is the intrinsic ability of the myocardium to generate force, independent of preload and afterload. If preload is how full the balloon is and afterload is the resistance you're squeezing against, contractility is the strength of your hand doing the squeezing. It is determined by calcium availability at the myofilament level and can be altered by drugs, ischemia, acidosis, temperature, and myocardial disease.",physiology:"Contractility is regulated by intracellular Ca\xB2\u207A. Catecholamines (epi, norepi) \u2192 \u03B21 \u2192 \u2191 cAMP \u2192 \u2191 Ca\xB2\u207A influx via L-type channels \u2192 stronger contraction. Acidosis, hypoxia, and hypothermia impair Ca\xB2\u207A cycling \u2192 \u2193 contractility. Post-CPB myocardial stunning is a transient Ca\xB2\u207A handling disorder from ischemia-reperfusion \u2014 contractility is depressed despite viable myocytes. This is why most stunning recovers in 24\u201372h.",measure:[["CI (Cardiac Index)","\u2265 2.2 L/min/m\xB2","Primary functional indicator of combined HR + SV output. Low CI = something in CO equation failing \u2014 isolate which."],["SvO\u2082 / ScvO\u2082","60\u201375% / \u226565%","Global O\u2082 extraction balance. Low SvO\u2082 = tissues extracting more because delivery is insufficient \u2192 contractility or anemia or HR problem."],["EF (Ejection Fraction)","\u2265 55% normal","Echo-derived. Low EF confirms systolic dysfunction. Normal EF + low CI = diastolic dysfunction or high afterload."],["Lactate","< 2 mmol/L","Proxy for tissue hypoperfusion. Trending down = improving delivery. Trending up = contractility or flow still insufficient."],["LVSWI (LV Stroke Work Index)","50\u201362 g\xB7m/m\xB2","Derived PA cath parameter. Quantifies LV mechanical work per beat. Rarely calculated clinically but theoretical foundation of inotropy assessment."]],tools:[{name:"Dobutamine",type:"\u03B21 Inotrope",detail:"First-line inotrope at THHBD. 2.5\u20135 mcg/kg/min for post-op stunning. \u2191 cAMP \u2192 \u2191 Ca\xB2\u207A \u2192 \u2191 contractility. Mild \u2193 SVR (\u03B22). Chronotropic \u2014 watch HR. Arrhythmogenic above 10 mcg/kg/min."},{name:"Milrinone",type:"PDE-3 Inhibitor",detail:"Prevents cAMP breakdown \u2192 same \u2191 Ca\xB2\u207A endpoint via different mechanism. Adds pulmonary vasodilation (\u2193 PVR). Ideal for RV failure post-MVR. Renally cleared \u2014 dose-reduce in AKI. Vasodilation often needs norepi co-infusion."},{name:"Epinephrine (low dose)",type:"\u03B21 > \u03B22 Inotrope",detail:"< 0.03 mcg/kg/min = pure inotrope (similar to dobutamine). 0.03\u20130.1 = balanced inotrope + vasopressor. Used when dobutamine alone fails or a single agent covering both CI and SVR is needed."},{name:"Calcium Chloride",type:"Direct Ca\xB2\u207A",detail:"Directly \u2191 myocardial Ca\xB2\u207A availability. Short-acting but powerful. Used for acute hypotension post-protamine, hyperkalemia, low ionized Ca\xB2\u207A (common post-CPB). Not a substitute for inotropes but excellent adjunct."},{name:"IABP / Impella",type:"Mechanical Inotrope",detail:"When pharmacologic inotropy is insufficient. IABP: \u2193 afterload + \u2191 diastolic coronary perfusion. Impella: directly unloads LV and augments forward flow. The 'external contractility' option."}],surgery:[{proc:"CABG \u2014 Myocardial Stunning",txt:"The most common cause of reduced contractility post-CABG. Transient Ca\xB2\u207A handling dysfunction from ischemia-reperfusion. EF may drop 10\u201320% acutely then recover over 24\u201372h. Distinguish from graft failure: stunning is global + gradual recovery; graft failure is regional (new WMA on echo) + doesn't recover."},{proc:"CABG \u2014 Hibernating Myocardium",txt:"Chronically ischemic myocardium that has 'downregulated' its function to survive. Unlike stunning, hibernation exists pre-op. After successful revascularization, hibernating myocardium recovers over weeks \u2014 not hours. Explains why some patients with poor pre-op EF improve dramatically 6 weeks post-CABG."},{proc:"Valve \u2014 Pressure Overload (AS, HOCM)",txt:"Chronic pressure overload (AS) = concentric hypertrophy = \u2191 wall thickness, \u2193 chamber size. Contractility may appear preserved by EF but LV work is massively increased. Post-AVR: the pressure load is suddenly relieved. If the hypertrophied LV is stiff or dysfunctional, it may paradoxically worsen CO as it adjusts. Dobutamine is used cautiously here."},{proc:"Valve \u2014 Volume Overload (MR, AR)",txt:"Chronic volume overload = eccentric hypertrophy = enlarged chamber + thin walls. High EF pre-op can mask reduced true contractility \u2014 regurgitant fraction 'padded' the output numbers. Post-surgery, the loading condition changes abruptly and true contractile reserve is unmasked. Low post-op CI despite 'good' pre-op EF = reduced contractile reserve exposed."}]},{id:"afterload",icon:"\u{1F527}",label:"AFTERLOAD POUCH",color:"#ef5350",bg:"rgba(239,83,80,0.08)",tagline:"How HARD does the ventricle have to push?",definition:"Afterload is the resistance the ventricle must overcome to eject blood. Think of it as the tightness of the nozzle the balloon has to push water through. High afterload = ventricle works harder for each mL ejected. The LV afterload is primarily SVR (systemic vascular resistance). The RV afterload is PVR (pulmonary vascular resistance). Afterload and contractility have an inverse relationship: \u2191 afterload \u2192 \u2193 stroke volume (for any given contractility). This is why afterload reduction can dramatically improve CO in heart failure.",physiology:"Afterload is governed by wall stress (Laplace's Law: Wall Stress = Pressure \xD7 Radius / 2 \xD7 Wall Thickness). A dilated, thin-walled LV faces enormous wall stress for any given pressure \u2014 this is why dilated cardiomyopathy + hypertension is such a dangerous combination. Afterload also changes with temperature: hypothermia \u2192 vasoconstriction \u2192 \u2191 SVR \u2192 \u2191 afterload. This is the mechanism behind the 'cold CI' post-CPB \u2014 the heart isn't necessarily weak, it's just pushing against a very tight nozzle.",measure:[["SVR (Systemic Vascular Resistance)","800\u20131200 dynes\xB7s/cm\u2075","LV afterload. Derived: [(MAP\u2212CVP)\xF7CO]\xD780. High SVR = vasoconstriction (hypovolemia, hypothermia, pain). Low SVR = vasodilation (vasoplegia, sepsis, post-CPB SIRS)."],["PVR (Pulmonary Vascular Resistance)","20\u2013120 dynes\xB7s/cm\u2075","RV afterload. Derived: [(mPAP\u2212PCWP)\xF7CO]\xD780. Elevated in pulmonary HTN, hypoxia, hypercarbia, acidosis. Critical for MVR patients."],["MAP (Mean Arterial Pressure)","65\u201390 mmHg (post-op)","Represents the downstream pressure the LV ejects into. MAP < 65 = insufficient organ perfusion pressure. MAP > 90 post-CABG = anastomosis tension risk."],["Pulse Pressure Variation","< 13%","PPV > 13% on A-line with mechanical ventilation = fluid responsive (preload, not afterload, is the limiting variable). PPV low despite low BP = afterload problem."]],tools:[{name:"Norepinephrine",type:"\u2191 Afterload (\u03B11)",detail:"Primary vasopressor. \u2191 SVR via \u03B11. Indicated when afterload is inappropriately low (vasoplegia, distributive shock). CAUTION: adding afterload to a failing LV worsens CI. Confirm contractility is adequate before using."},{name:"Vasopressin",type:"\u2191 Afterload (V1)",detail:"V1 receptor vasoconstriction, independent of catecholamine pathway. Add at 0.03 units/min when norepi dose escalates. Ceiling: 0.04 units/min. Mesenteric ischemia risk beyond this."},{name:"Phenylephrine",type:"\u2191 Afterload (pure \u03B11)",detail:"Pure vasoconstriction, no inotropy, causes reflex bradycardia. Situational use post-CABG. AVOID in LVOTO (worsens dynamic obstruction paradoxically). Useful in SVT with hypotension."},{name:"Nicardipine",type:"\u2193 Afterload (arterial CCB)",detail:"Preferred post-CABG hypertension agent at THHBD. Coronary vasodilating properties. 20\u201330 min offset \u2014 titrate conservatively."},{name:"NTG (High dose > 100 mcg/min)",type:"\u2193 Afterload + Preload",detail:"Arterial vasodilation begins above 100 mcg/min. Combined preload + afterload reduction. Used for acute LV failure, graft spasm, post-CABG HTN."},{name:"Nitroprusside",type:"\u2193 Afterload (most potent)",detail:"Arterial > venous. Most powerful IV vasodilator. 1\u20132 min onset/offset. Cyanide toxicity > 4 mcg/kg/min or > 72h. Reserved for hypertensive emergencies."},{name:"Milrinone",type:"\u2193 Afterload (PVR)",detail:"Pulmonary-selective vasodilator via PDE-3 inhibition. Reduces RV afterload. Preferred for elevated PVR post-MVR. Also systemically vasodilates \u2014 add norepi to support MAP."}],surgery:[{proc:"CABG \u2014 Afterload and Graft Protection",txt:"Post-CABG MAP > 90 puts mechanical tension on every anastomosis site. The graft's weakest point is the suture line \u2014 excessive pressure risks bleeding and dehiscence. Target MAP 65\u201380 actively. Tachycardia AND hypertension together are the two biggest early post-CABG graft threats. Nicardipine is the preferred afterload reduction agent at THHBD for its coronary vasodilating effect."},{proc:"CABG \u2014 The Cold SVR Trap",txt:"Post-CPB hypothermia (< 36\xB0C) dramatically \u2191 SVR via peripheral vasoconstriction. This artificially elevates MAP and masks the true hemodynamic picture. Do NOT start vasodilators at 35\xB0C \u2014 the SVR will normalize with rewarming. The mistake: treating a 'high MAP' cold patient with NTG \u2192 crash when they warm and SVR drops."},{proc:"AVR (AS) \u2014 The LVOTO Danger",txt:"Dynamic LVOTO occurs when a hypertrophied LV + \u2193 preload + \u2191 HR + inotropes create subaortic flow obstruction. Paradoxically, afterload REDUCTION (vasodilators) worsens LVOTO by reducing the pressure the outflow tract must overcome. Treatment: \u2191 afterload (phenylephrine), \u2191 preload (volume), \u2193 HR, STOP inotropes. Echo is diagnostic."},{proc:"MVR \u2014 RV Afterload Crisis",txt:"Post-MVR RV faces the full pulmonary circulation without the LA acting as a 'pressure relief valve.' If pre-existing pulmonary HTN (elevated PVR) is present, RV is suddenly working against a high afterload wall it cannot overcome. Milrinone \u2193 PVR. Inhaled NO/prostacyclin \u2193 PVR selectively. Avoid hypoxia + hypercarbia (both \u2191 PVR acutely). This is RV afterload-driven failure \u2014 not volume deficiency."}]}],a=n?r.find(l=>l.id===n):null;return(0,o.jsxs)("div",{children:[(0,o.jsx)("div",{style:{display:"flex",gap:6,marginBottom:14,flexWrap:"wrap"},children:[["framework","\u{1F3AF} The Framework"],["pouches","\u{1F45C} The Belt Bag"],["values","\u{1F4CA} Normal Values"],["glossary","\u{1F4D6} Key Terms"]].map(([l,s])=>(0,o.jsx)("button",{onClick:()=>t(l),style:{padding:"7px 14px",borderRadius:20,border:`1px solid ${e===l?"#c8972b":"rgba(255,255,255,0.1)"}`,background:e===l?"rgba(200,151,43,0.15)":"rgba(255,255,255,0.03)",color:e===l?"#c8972b":"#78909c",fontWeight:e===l?700:500,fontSize:11,cursor:"pointer"},children:s},l))}),e==="framework"&&(0,o.jsxs)("div",{children:[(0,o.jsxs)("div",{style:{background:"linear-gradient(135deg,rgba(200,151,43,0.12),rgba(0,188,212,0.06))",border:"1px solid rgba(200,151,43,0.35)",borderRadius:14,padding:"18px 16px",marginBottom:14},children:[(0,o.jsx)("div",{style:{color:"#c8972b",fontWeight:800,fontSize:14,marginBottom:6},children:"\u{1F45C} The Hemodynamic Belt Bag"}),(0,o.jsxs)("p",{style:{color:"#ffe0b2",fontSize:12,lineHeight:1.8,margin:"0 0 10px"},children:["Think of hemodynamic management as a belt bag you wear at the bedside. Around your waist hang ",(0,o.jsx)("b",{style:{color:"#42a5f5"},children:"three pouches"})," \u2014 one for each determinant of stroke volume. When a patient's olic dysfunction."],["Diastolic Dysfunction","Impaired LV relaxation/filling. EF may be preserved (HFpEF). Common post-AVR-AS. High filling pressures needed. Intolerant of tachycardia (less diastolic filling time) or hypovolemia (abrupt preload loss)."],["Systolic Dysfunction","Reduced myocardial contractility \u2192 low EF. LV fails to eject adequate volume per beat. CO maintained initially by compensatory \u2191 HR and dilation. Treated with inotropes + afterload reduction."],["Frank-Starling Law","Within physiologic range, SV \u2191 as end-diastolic volume \u2191 (more stretch = more force). Beyond optimal fiber length, additional volume is harmful. Foundation of preload management in the CVICU."],["Laplace's Law","Wall stress = (Pressure \xD7 Radius) \xF7 (2 \xD7 Wall Thickness). Explains why a dilated, thin-walled LV faces high afterload and why eccentric hypertrophy worsens prognosis."],["Cardiac Index (CI)","CO normalized for body surface area. Corrects for body size. Gold standard for output assessment. < 2.2 = hemodynamically significant low output state in adults."],["SvO\u2082","Mixed venous O\u2082 saturation from PA distal port. Reflects global O\u2082 extraction: \u2193 SvO\u2082 = \u2191 extraction = delivery insufficient for demand. Normal 60\u201375%. < 55% = critical delivery deficit."],["PPV (Pulse Pressure Variation)","Beat-to-beat variation in arterial pulse pressure during mechanical ventilation. PPV > 13% indicates fluid responsiveness \u2014 preload, not afterload, is the limiting factor. Only valid in sinus rhythm on full ventilator support."],["DO\u2082 (O\u2082 Delivery)","Amount of O\u2082 delivered to tissues per minute = CO \xD7 O\u2082 content. Impaired by low CO, low Hgb, or low SaO\u2082. Optimizing all three is the goal of CVICU hemodynamic management."]].map(([l,s],d)=>(0,o.jsxs)("div",{style:{background:"rgba(255,255,255,0.03)",border:"1px solid rgba(255,255,255,0.07)",borderRadius:8,padding:"10px 12px"},children:[(0,o.jsx)("div", arily \u03B21 inotrope (similar to dobutamine). 0.03\u20130.1: balanced inotrope + vasopressor. > 0.1: predominantly \u03B1 vasopressor. This dose-dependent shift is clinically important.",thhbd:"Used as a 2nd-line agent when dobutamine + norepi are not achieving hemodynamic goals, or when a single agent with both inotropy and vasopressor effect is needed."},{drug:"Vasopressin (ADH)",short:"Vaso",rcpt:"V1 (vascular)",dose:"0.01\u20130.04 units/min",hr:"\u2193",bp:"\u2191",co:"\u2014",svr:"\u2191",use:"Adjunct vasopressor. Norepinephrine-sparing. First-line adjunct in post-bypass vasoplegia. Catecholamine-independent mechanism.",dose_detail:"Fixed dose range \u2014 not typically titrated to effect beyond 0.04 units/min. Add at 0.03 units/min when norepi \u2265 0.1 mcg/kg/min to spare catecholamine dose. No significant dose-dependent effect range.",thhbd:"Commonly added as 2nd vasopressor at THHBD when norepi dose escalates. Particularly effective in post-bypass vasoplegia (catecholamine-independent V1 mechanism)."},{drug:"Phenylephrine (Neo-Synephrine)",short:"Phenyl",rcpt:"\u03B11 only",dose:"0.5\u20136 mcg/kg/min",hr:"\u2193",bp:"\u2191",co:"\u2193",svr:"\u2191",use:"SVT with hypotension (reflex bradycardia helps). Pure vasoconstriction \u2014 no inotropy. Avoid in low CO states.",dose_detail:"Pure \u03B11 \u2014 no \u03B2 effect. Predictable SVR increase with reflex bradycardia. Higher doses: progressive \u2191 SVR, potentially \u2193 CO due to \u2191 afterload on an impaired LV.",thhbd:"Caution post-AVR (AS): phenylephrine can worsen dynamic LVOTO. Situational use \u2014 not a routine first-line choice here."},{drug:"Dobutamine",short:"Dobut",rcpt:"\u03B21 >> \u03B22",dose:"1\u201320 mcg/kg/min (2.5\u20135 typical at THHBD)",hr:"\u2191",bp:"\xB1",co:"\u2191\u2191",svr:"\u2193",use:"Primary inotrope for LCOS. Myocardial stunning post-CPB. Cardiogenic shock. Increases CO by \u2191 contractility and mild \u2193 afterload.",dose_detail:"1\u20132.5 mcg/kg/min: mild in Dopaminergic (DA1/DA2) \u2014 RENAL DOSE","\u2191 Splanchnic and renal blood flow via dopaminergic receptors. \u2191 UOP via DA1 in renal tubules. Used at THHBD for patients at risk for post-op oliguria (prolonged CPB, pre-existing CKD, low-output state). Evidence for mortality benefit is mixed but clinical practice supports renal perfusion optimization.","#29b6f6"],["3\u201310 mcg/kg/min","\u03B21 dominant \u2014 INOTROPE","\u2191 HR, \u2191 contractility, \u2191 CO. Moderate inotropic effect. Can cause significant tachycardia. Less targeted than dobutamine for pure inotropy.","#00e676"],["10\u201320 mcg/kg/min","\u03B11 dominant \u2014 VASOPRESSOR","\u2191 SVR. Significant tachycardia risk. Generally replaced by norepinephrine for vasopressor effect at most centers. Rarely used at high doses.","#ef5350"]].map(([s,d,p,m])=>(0,o.jsxs)("div",{style:{background:"rgba(255,255,255,0.03)",border:`1px solid ${m}44`,borderRadius:8,padding:10},children:[(0,o.jsxs)("div",{style:{display:"flex",gap:10,alignItems:"center",marginBottom:4},children:[(0,o.jsx)("div",{style:{color:m,fontWeight:700,fontSize:11},children:s}),(0,o.jsx)("div",{style:{background:`${m}22`,color:m,borderRadius:4,padding:"2px 8px",fontSize:9,fontWeight:700},children:d})]}),(0,o.jsx)("div",{style:{color:"#90a4ae",fontSize:11,lineHeight:1.5},children:p})]},s))}),(0,o.jsx)(Ct,{text:"Dopamine 1\u20133 mcg/kg/min is used at THHBD as a renal protective strategy in patients with risk factors for post-op acute kidney injury. Monitor UOP trends and Cr closely."})]})]}),(0,o.jsx)(M,{text:"Epi < 0.03 mcg/kg/min behaves like dobutamine. This is clinically important: when dobutamine isn't available or you need inotropy + mild tone support, low-dose epi is a pharmacologically sound choice."})]}),e==="combo"&&(0,o.jsxs)("div",{children:[(0,o.jsx)(I,{children:"Combination & Stepwise Therapy"}),(0,o.jsx)("p",{style:{color:"#90a4ae",fontSize:12,lineHeight:1.7,marginBottom:14},children:"Post-cardiac surgery patients frequently need more than one vasoactive agent because their hemodynamic deficits are multi-factorial. Think of combination therapy as addressing each pathophysiologic deficit with the right drug \u2014 not polypharmacy for its own sake."}),(0,o.jsx)("div",{style:{display:"grid",gap:10,marginBottom:12},children:l.map((s,d)=>(0,o.jsxs)("div",{style:{background:s.bg,border:`1px solid ${s.c}44`,borderRadius:10,padding:14},children:[(0,o.jsx)("div",{style:{display:"flex",gap:10,alignItems:"center",marginBottom:10},children:(0,o.jsxs)("div",{style:{background:`${s.c}22`,color:s.c,borderRadius:8,padding:"4px 10px",fontWeight:700,fontSize:12},children:[s.icon," ",s.pair]})}),(0,o.jsxs)("div",{style:{display:"grid",gap:6,fontSize:11},children:[(0,o.jsxs)("div",{style:{display:"grid",gridTemplateColumns:"80px 1fr",gap:8},children:[(0,o.jsx)("div",{style:{color:s.c,fontWeight:700},children:"When"}),(0,o.jsx)("div",{style:{color:"#cfd8dc"},children:s.when})]}),(0,o.jsxs)("div",{style:{display:"grid",gridTemplateColumns:"80px 1fr",gap:8},children:[(0,o.jsx)("div",{style:{color:s.c,fontWeight:700},children:"Mechanism"}),(0,o.jsx)("div",{style:{color:"#90a4ae",lineHeight:1.5},children:s.mech})]}),(0,o.jsxs)("div",{style:{background:"rgba(0,0,0,0.2)",borderRadius:6,padding:"8px 10px",fontSize:10.5,color:"#78909c",marginTop:4},children:[(0,o.jsx)("b",{style:{color:"#c8972b"},children:"Example: "}),s.eg]})]})]},d))}),(0,o.jsxs)("div",{style:{background:"rgba(255,255,255,0.03)",border:"1px solid rgba(255,255,255,0.1)",borderRadius:10,padding:14},children:[(0,o.jsx)("div",{style:{color:"#cfd8dc",fontWeight:700,fontSize:12,marginBottom:10},children:"Stepwise Decision Guide"}),(0,o.jsx)("div",{style:{display:"grid",gap:6,fontSize:11},children:[["CI < 2.2, MAP adequate","Start dobutamine 2.5 mcg/kg/min. Goal: CI > 2.2 on minimal dose."],["CI < 2.2, MAP < 65 (low SVR)","Add norepi to dobutamine. Address both deficits independently."],["RV failure (CVP >> PCWP)","Add milrinone to dobutamine (\u2191 RV inotropy + \u2193 PVR). Add norepi if MAP drops."],["Vasoplegia (CI adequate, SVR low)","Norepi 1st \u2192 add vasopressin 2nd \u2192 methylene blue if refractory."],["CI < 2.2 despite dobut 5 mcg/kg/min","Add low-dose epi 0.02\u20130.05 mcg/kg/min. Escalating to triple therapy = MCS discussion."],["Triple therapy not achieving goals","IABP or Impella discussion with surgeon/intensivist. MCS is the next level."]].map(([s,d],p)=>(0,o.jsxs)("div",{style:{display:"grid",gridTemplateColumns:"220px 1fr",gap:10,borderBottom:"1px solid rgba(255,255,255,0.05)",paddingBottom:6,marginBottom:4},children:[(0,o.jsx)("div",{style:{color:"#ffd54f",fontWeight:700,lineHeight:1.4},children:s}),(0,o.jsx)("div",{style:{color:"#90a4ae",lineHeight:1.5},children:d})]},p))})]}),(0,o.jsx)(M,{text:"Combination therapy should follow logic, not just escalation. Ask: What is the PRIMARY deficit (CO, SVR, or both)? Then choose agents that address each deficit at their best receptor."})]}),e==="limit"&&(0,o.jsxs)("div",{children:[(0,o.jsx)("p",{style:{color:"#90a4ae",fontSize:12,lineHeight:1.7,marginBottom:6},children:"Every vasoactive agent has a therapeutic window. Within it, the intended effect improves hemodynamics. Beyond it, the drug's side-effect profile begins to outweigh \u2014 or actively reverse \u2014 its benefit. This section defines what to monitor, what good looks like, and the specific signals that tell you the drug has crossed that line."}),(0,o.jsx)(di,{text:"The goal is never the highest dose. The goal is the lowest dose that achieves the target endpoint. Dose escalation beyond the therapeutic window is a sign to add a second agent or escalate to MCS \u2014 not to keep titrating."}),(0,o.jsx)("div",{style:{display:"grid",gap:10,marginTop:14},children:[{drug:"Norepinephrine (Levophed)",short:"Norepi",c:"#ef5350",bg:"rgba(239,83,80,0.06)",intended:"\u2191 MAP via \u03B11 vasoconstriction. Target: MAP 65\u201380 mmHg with stable or improving CI.",monitor:[["MAP q15\u201330 min","Primary target. Should trend toward 65\u201380. Document each titration response."],["CI / CO","Must not fall as MAP rises. If CI drops with each dose \u2191, norepi is worsening LV workload."],["Urine output","\u2191 UOP with improved MAP = organ perfusion restored. Persistent oliguria despite MAP 70+ = still hypoperfused."],["Extremities + capillary refill","Vasoconstriction should be systemic, not excessive. Mottled legs, cold fingers = peripheral ischemia."],["Lactate trend","Rising lactate despite MAP correction = maldistributed flow. The number doesn't equal perfusion."],["ScvO\u2082","Should rise with improved MAP and perfusion. Falling ScvO\u2082 despite \u2191 MAP = CI dropping."]],limit:[["CI falls as dose escalates","\u2191 SVR is increasing LV afterload faster than MAP benefit. Norepi is now working against an already-impaired LV. Add inotrope (dobutamine) rather than titrating further."],["Dose > 0.5 mcg/kg/min with no MAP response","Catecholamine-resistant vasoplegia. Add vasopressin 0.03 units/min. Further norepi beyond this has diminishing returns and maximal side effects."],["Rising lactate with MAP now adequate","Flow distribution failure. High SVR is redirecting blood away from gut/kidneys despite 'good' MAP. Reassess volume status, add vasopressin, consider methylene blue."],["Mottling progressing distally","Peripheral ischemia from excessive vasoconstriction. Dose is impairing microcirculation. Do not titrate further."],["New or worsening tachyarrhythmia","\u03B21 stimulation at higher doses driving HR and arrhythmias. Consider substituting vasopressin for dose-sparing."]]},{drug:"Dobutamine",short:"Dobut",c:"#00e676",bg:"rgba(0,230,118,0.06)",intended:"\u2191 CI via \u2191 contractility. Target: CI \u2265 2.2 L/min/m\xB2, ScvO\u2082 \u2265 65%, UOP \u2265 0.5 mL/kg/hr, lactate trending down.",monitor:[["CI trend","Primary endpoint. Should improve within 30\u201360 min of starting. If not, reassess diagnosis \u2014 is this really low contractility?"],["HR","Dobutamine is chronotropic. HR increase of 10\u201315 bpm is acceptable. HR > 100\u2013110 from dobutamine = tachycardia eroding diastolic filling time."],["MAP","Dobutamine mildly \u2193 SVR. MAP should remain stable or improve with \u2191 CI. MAP falling = vasodilation exceeded CI gain."],["ScvO\u2082 + lactate","Best functional endpoints. ScvO\u2082 rising toward \u2265 65% and lactate clearing = drug is working."],["UOP","Should improve as renal perfusion restores. Persistent oliguria despite CI > 2.2 = consider other causes."],["ECG / rhythm","Dobutamine is arrhythmogenic. Watch for new PVCs, VT, or AF acceleration."]],limit:[["HR > 100\u2013110 bpm from dobutamine","Tachycardia shortens diastole \u2192 \u2193 filling time \u2192 \u2191 myocardial O\u2082 demand on fresh grafts. The HR cost now negates the CI gain. Reduce dose. Consider adding milrinone for inotropy with less chronotropy."],["MAP drops despite CI improving","\u2193 SVR from dobutamine \u03B22 effect exceeding CO gain. Add norepi to restore MAP rather than stopping dobutamine."],["Dose > 5 mcg/kg/min at THHBD with no CI response","Escalating beyond 5 without benefit = myocardial unresponsiveness. Add low-dose epinephrine or milrinone rather than pushing dobutamine higher. Discuss MCS."],["New sustained VT or frequent runs of PVCs","Arrhythmogenic threshold reached. Dobutamine must be reduced or stopped. Stabilize rhythm first."],["Worsening dynamic LVOTO on echo (post-AVR-AS)","Inotropic stimulation of hypertrophied LV worsening subaortic obstruction. STOP dobutamine immediately. Use phenylephrine + volume instead."]]},{drug:"Milrinone (Primacor)",short:"Milrin",c:"#ab47bc",bg:"rgba(171,71,188,0.06)",intended:"\u2191 CI (inotropy) + \u2193 PVR (pulmonary vasodilation). Target: CI \u2265 2.2, CVP falling, \u2193 RV dilation on echo, MAP stable.",monitor:[["MAP","Milrinone's most significant limitation: vasodilation lowers SVR. MAP should remain \u2265 65. Any fall demands attention."],["CVP trend","In RV failure, CVP should fall as RV begins to decompress. Flat or rising CVP despite milrinone = RV not responding."],["CI","Should improve. If CI improving but MAP falling, the vasodilation is outpacing the benefit."],["PA pressures / PVR","The intended pulmonary effect. mPAP and PVR should trend down."],["Urine output","Milrinone is renally cleared. AKI will cause drug accumulation and prolonged effect. Monitor Cr and adjust dose in renal impairment."]],limit:[["MAP < 60\u201365 despite norepi co-infusion","Vasodilatory effect has overwhelmed the inotropy + norepi support. Reduce milrinone dose. Consider switching RV inotropy to low-dose epinephrine which adds vascular tone."],["Accumulation in AKI (Cr rising rapidly)","Milrinone t\xBD doubles in renal failure. Dose must be reduced 50% when CrCl < 50 mL/min. If anuric, effects may persist 6\u20138h after stopping."],["CVP not falling after 2\u20134h","RV not responding to milrinone. Escalate: add inhaled NO/prostacyclin, discuss RVAD. Don't keep pushing milrinone dose hoping for a different result."],["New sustained hypotension requiring rapid norepi escalation","Milrinone vasodilation is now driving hemodynamic instability. Drug benefit has been negated. Wean and reassess."]]},{drug:"Epinephrine",short:"Epi",c:"#ffa726",bg:"rgba(255,167,38,0.06)",intended:"At low dose (< 0.03): inotropy. At higher dose: combined inotropy + vasopressor. Target: CI \u2191, MAP \u2191, without HR > 110 or arrhythmia.",monitor:[["HR","Most sensitive marker. Every dose increase should be evaluated against HR change. Epinephrine is strongly chronotropic."],["CI and MAP together","Both should improve proportionally. If MAP rises but CI falls, \u03B11 afterload is now dominant and LV is struggling."],["Rhythm \u2014 continuous ECG","Epinephrine is the most arrhythmogenic of the vasoactive agents. PVCs \u2192 VT \u2192 VF progression must be caught early."],["Potassium","Epinephrine drives K\u207A intracellularly (\u03B22). Serial K\u207A every 2h on high doses. Hypokalemia further increases arrhythmia risk."],["Lactate","High-dose epi causes hyperglycemia + lactic acidosis from \u03B22 stimulation of glycogenolysis. Lactate rising on epinephrine \u2260 always tissue hypoperfusion."],["Glucose","Epinephrine drives hepatic glycogenolysis. Significant hyperglycemia expected at doses > 0.1 mcg/kg/min."]],limit:[["HR > 110\u2013120 bpm","Tachycardia from \u03B21 is now reducing diastolic filling time and \u2191 myocardial O\u2082 demand. The cost outweighs the contractility gain. Reduce dose or switch strategy."],["New VT or arrhythmia requiring treatment","Arrhythmogenic threshold crossed. Stop escalating. Treat rhythm, reassess choice of agent. Milrinone may be safer inotrope if HR is the main concern."],["MAP rising but CI not improving or falling","\u03B11 effect is now dominant \u2014 vasoconstriction is increasing LV afterload beyond the inotropy benefit. You've passed the balance point. Reduce dose or add vasodilator."],["Lactate rising despite apparent hemodynamic improvement","High-dose epi-induced lactic acidosis (\u03B22 metabolic effect, not ischemia). Interpret lactate in context. Confirm with ScvO\u2082 \u2014 if ScvO\u2082 adequate, lactate rise may be metabolic, not hypoperfusion."],["K\u207A < 3.0 despite aggressive repletion","\u03B22-driven intracellular shift. Continuing to escalate epi will worsen hypokalemia further. Dangerous arrhythmia substrate \u2014 reassess agent."]]},{drug:"Vasopressin",short:"Vaso",c:"#29b6f6",bg:"rgba(41,182,246,0.06)",intended:"\u2191 SVR via V1 receptors independent of catecholamine pathways. Target: MAP \u2191 by 5\u201315 mmHg, norepi dose \u2193 (dose-sparing effect).",monitor:[["MAP","Should improve within 15\u201330 min of starting. Primary endpoint."],["Norepi dose trend","A key success marker for vasopressin: norepi requirement should plateau or fall. If norepi continues to escalate despite vasopressin, V1 mechanism is not the dominant pathway."],["Urine output","Vasopressin at physiologic doses (0.01\u20130.04 units/min) can mildly \u2193 UOP via V2 renal tubular water retention. Persistent oliguria may reflect this vs. hypoperfusion."],["Mesenteric / skin perfusion","Splanchnic vasoconstriction is the most clinically relevant side effect. Watch for abdominal distension, ileus, rising LFTs with prolonged use."],["CO/CI","Vasopressin does not improve contractility. If CI falls as SVR rises, the LV is failing against the added afterload."]],limit:[["Dose > 0.04 units/min","Supraphysiologic dosing \u2192 severe mesenteric and coronary vasoconstriction. Beyond 0.04 = significant ischemia risk without proportional MAP benefit. Do not titrate above this \u2014 escalate to methylene blue instead."],["CI falling as MAP responds","V1 vasoconstriction is \u2191 LV afterload. MAP is 'improving' but at the cost of CI. Net effect: worse tissue perfusion. Add inotrope or reduce vasopressin."],["UOP remains < 0.3 mL/kg/hr","V2-mediated antidiuresis contributing to oliguria. Consider furosemide if volume-replete. Vasopressin is sustaining oliguria."],["Mesenteric ischemia signs (ileus, \u2191 LFTs, abdominal pain)","Splanchnic vasoconstriction has produced end-organ ischemia. This drug must be weaned and its contribution to gut ischemia re-evaluated \u2014 particularly with prolonged infusion > 24\u201348h."]]},{drug:"Nitroglycerin (NTG)",short:"NTG",c:"#66bb6a",bg:"rgba(102,187,106,0.06)",intended:"\u2193 preload (venodilation) + coronary vasodilation (graft spasm). Target: MAP reduction by 10\u201320 mmHg from hypertensive baseline, resolution of ST changes.",monitor:[["MAP","Primary titration endpoint. Target MAP 65\u201380 for post-CABG HTN management. Titrate in 10\u201325 mcg/min increments."],["HR","Reflex tachycardia from venodilation + hypotension. HR > 100 = over-vasodilated."],["CVP / filling pressures","NTG primarily venodilates \u2192 \u2193 preload. CVP should fall modestly. Rapid CVP dr \u2467 Fibrinogen Concentrate: Alternative to cryo. More controlled dosing. Emerging use in cardiac surgery. Target fibrinogen \u2265 200 mg/dL.
\u2468 Protamine redose: If activated clotting time (ACT) still elevated.
\u2469 Call surgeon threshold: > 200\u2013300 mL/hr \xD7 2h, OR sudden \u2191 output, OR hemodynamic instability, OR tamponade signs.`,warn:"The 'Lethal Triad' \u2014 hypothermia + acidosis + coagulopathy \u2014 kills. You must actively correct all three simultaneously, not sequentially. Warm the patient, buffer the pH, and replace clotting factors in parallel.",extra:{title:"TEG / Thromboelastography + Platelet Mapping",color:"#ef9a9a",content:`TEG measures the entire coagulation process from clot formation to fibrinolysis in real time. It answers the question: WHERE is the coagulation deficit? This guides product selection more precisely than INR/PTT alone.

KEY TEG PARAMETERS:
\u2022 R-time (reaction time): Time to initial clot formation. Prolonged = factor deficiency \u2192 give FFP
\u2022 K-time (clot kinetics): Speed of clot strengthening. Prolonged = fibrinogen deficiency \u2192 give cryo/fibrinogen
\u2022 Alpha angle (\u03B1): Rate of fibrin cross-linking. Decreased = fibrinogen deficiency
\u2022 MA (maximum amplitude): Clot strength. Decreased = platelet dysfunction or low count \u2192 give platelets
\u2022 LY30 (lysis at 30 min): Fibrinolysis. > 7.5% = hyperfibrinolysis \u2192 give TXA (tranexamic acid)

PLATELET MAPPING (modified TEG): Assesses platelet function in patients on aspirin or P2Y12 inhibitors (clopidogrel, ticagrelor). Shows what PERCENTAGE of platelet function is inhibited. Critical in post-op bleeding where patient was on antiplatelet therapy pre-op. If arachidonic acid inhibition (AA) > 50% = aspirin effect present. If ADP inhibition > 50% = P2Y12 effect. Guides whether platelet transfusion will actually help.

HEMODYNAMIC BLEEDING PROFILE:
Active mediastinal hemorrhage typically shows: \u2193 MAP (progressive), \u2193 CVP (volume loss), \u2193 CI, \u2193 SvO\u2082 (tissues extracting more from less CO), \u2191 HR (compensatory), \u2191 lactate (hypoperfusion). Chest tubes draining > 200 mL/hr. If chest tubes suddenly STOP \u2192 tamponade. Both patterns require urgent action.`}},{name:"Cardiac Tamponade",icon:"\u{1F489}",color:"#ab47bc",profile:[["SIGNATURE","CVP \u2248 PCWP/PA diast \u2248 RVP diast","Pathognomonic pressure equalization"],["Chest Tubes","Suddenly stopped","Clot trapping blood inside pericardium"],["MAP","Progressive \u2193","Tachycardia + narrow pulse pressure"],["CO/CI","\u2193\u2193 despite \u2191 filling","Pericardial compression"]],tx:`SURGICAL EMERGENCY:
1. Call surgeon STAT
2. Prep for bedside resternotomy
3. Gently strip/milk chest tubes
4. Bolus 250\u2013500 mL IVF to temporize
5. Cardiac arrest \u2192 open chest immediately (CPR ineffective for surgical tamponade)`,warn:"Beck's Triad is often incomplete post-sternotomy. Do NOT wait for all three signs. Pressure equalization + stopped tubes + deterioration = act now."},{name:"LCOS (Low Cardiac Output Syndrome)",icon:"\u{1FAC1}",color:"#ffa726",profile:[["CI","< 2.0\u20132.2 L/min/m\xB2","Primary definition"],["Lactate","> 2 mmol/L \u2191 trending","Tissue hypoperfusion"],["ScvO\u2082","< 60\u201365%","\u2191 O\u2082 extraction"],["UOP","< 0.5 mL/kg/hr","Renal hypoperfusion"]],tx:`1. Optimize PRELOAD (CVP/PA diastolic guided)
2. Rate/rhythm \u2014 DDD pace if HR < 70; cardiovert AF
3. Inotropes \u2014 dobutamine 2.5\u20135 mcg/kg/min 1st-line; milrinone for RV/PVR
4. Combination \u2014 add low-dose epi if dobutamine inadequate
5. IABP or Impella if CI remains < 2.0 despite pharmacologic therapy

Goal: CI > 2.2, ScvO\u2082 > 65%, UOP > 0.5 mL/kg/hr, lactate trending down`,warn:"Do NOT give norepinephrine alone for LCOS. Increasing afterload on a failing ventricle worsens output."},{name:"Vasoplegia",icon:"\u{1F321}\uFE0F",color:"#29b6f6",profile:[["MAP","< 65 (often 45\u201355)","Despite normal/high CO"],["CO/CI","NORMAL or \u2191","KEY differentiator from cardiogenic"],["SVR","\u2193\u2193 (often < 600)","Profound vasodilation"],["SvO\u2082","Often > 75%","Maldistributed O\u2082"]],tx:`1. Norepinephrine 1st-line (\u03B11 vasoconstriction)
2. Vasopressin 0.03 units/min (catecholamine-independent V1)
3. Methylene blue 1.5 mg/kg IV \xD7 20 min (blocks NO synthase \u2014 rescue therapy)
4. Hydrocortisone 50 mg IV q6h (relative adrenal insufficiency)

Modest IVF to CVP 8\u201310. DO NOT add inotropes \u2014 CI is already adequate.`,warn:"Methylene blue: contraindicated in G6PD deficiency. Transiently drops SpO\u2082 reading \u2014 expected. Check G6PD before use when time permits."},{name:"Post-Op Hypertensive Crisis",icon:"\u{1F4C8}",color:"#66bb6a",profile:[["MAP","> 90\u2013100 mmHg","Fresh anastomosis tension"],["Cause","Pain + catecholamines + rewarming","First 2\u20136 hrs post-op"],["Risk","Graft bleeding at anastomosis","Most critical in first 12h"]],tx:`1. Treat pain first (fentanyl, hydromorphone)
2. Nicardipine 5\u201315 mg/hr (preferred post-CABG \u2014 coronary vasodilator)
3. Labetalol IV (HR + BP)
4. NTG infusion (ischemia + HTN)
5. Nitroprusside for extreme emergencies (cyanide risk with prolonged use)`,warn:"MAP > 90 in a fresh CABG patient puts tension on ALL anastomosis sites. This is graft protection, not cosmetic BP management."},{name:"Post-Op Atrial Fibrillation (POAF)",icon:"\u3030\uFE0F",color:"#42a5f5",profile:[["Incidence","25\u201340% post-cardiac surgery","Peaks POD 2\u20133"],["CO Effect","\u2193 10\u201325% (loss of atrial kick)","Worse in diastolic dysfunction"],["MAP","Often drops 10\u201320 mmHg","Especially with rapid ventricular rate"],["Electrolytes","K\u207A < 4.0 or Mg\xB2\u207A < 2.0","Primary treatable driver"]],tx:`Hemodynamically stable: Amiodarone 300 mg IV load + infusion. Rate control (metoprolol, diltiazem). Aggressive electrolyte repletion: K\u207A \u2265 4.0, Mg\xB2\u207A \u2265 2.0.
Hemodynamically unstable (MAP < 60 on POAF): Synchronized cardioversion 200J biphasic. Anticoagulation per protocol (LA clot risk after 48h).`,warn:"Electrolyte repletion is the most underutilized POAF treatment. K\u207A < 4.0 and Mg\xB2\u207A < 2.0 after cardiac surgery = arrhythmia invitation."},{name:"Post-Op Stroke",icon:"\u{1F9E0}",color:"#e91e63",profile:[["Incidence","~1\u20132% CABG, higher in combined/redo","2\u20134\xD7 higher with AF/aortic atheromatous disease"],["Timing","On awakening or within 24h","Can be delayed 24\u201348h"],["MAP Impact","BP management critical post-stroke","Permissive hypertension (MAP 70\u201390) for 24h"]],tx:`IMMEDIATE RECOGNITION:
\u2022 Unilateral weakness, facial droop, dysarthria, visual field defect on awakening
\u2022 New agitation/confusion inconsistent with anesthesia
\u2022 Pupil asymmetry, gaze deviation

ACTION:
1. Notify surgeon + neurologist STAT
2. Non-contrast CT head immediately (rule out hemorrhagic stroke \u2014 thrombolytics/anticoagulation decision)
3. MRI/MRA if CT negative and high clinical suspicion (DWI sequence for ischemia)
4. MAP target 70\u201390 mmHg for 24h (permissive hypertension supports ischemic penumbra perfusion)
5. Avoid hypoglycemia (glucose 140\u2013180)
6. Fever control (hyperthermia worsens neurologic injury)
7. Anticoagulation: balance stroke risk vs. surgical bleeding \u2014 neurology and surgical joint decision

FOLLOW-UP: Neuro checks q1\u20132h. Document NIHSS or simplified neuro exam (LOC, motor, language).`,warn:"Do NOT aggressively treat hypertension in the first 24h of ischemic stroke (unless MAP > 220/120 or hemorrhagic). Permissive hypertension maintains penumbra perfusion. This is the OPPOSITE of your usual post-CABG BP management."},{name:"Graft Stenosis / Acute Graft Failure",icon:"\u{1FA7A}",color:"#ff7043",profile:[["ST Changes","New ST elevation or depression","Distribution of specific graft territory"],["Troponin","Rising serially post-op","Distinguish from routine post-op leak"],["CI","Declining despite adequate filling","LV territory ischemia"],["Echo","New wall motion abnormality (WMA)","Regional = graft failure; global = LCOS"]],tx:`EARLY (< 24h) \u2014 Likely technical or spasm:
\u2022 Notify surgeon immediately
\u2022 IV NTG + diltiazem for arterial graft spasm
\u2022 IABP to support coronary perfusion pressure
\u2022 Prepare for urgent catheterization or re-exploration

LATE (> 24h) \u2014 Likely thrombosis or technical:
\u2022 Emergent cath lab evaluation
\u2022 PCI if amenable (SVG thrombosis \u2192 aspiration + stenting)
\u2022 Re-operation if non-amenable

HEMODYNAMIC MANAGEMENT (BRIDGE TO INTERVENTION):
\u2022 IABP: \u2191 diastolic coronary perfusion + \u2193 LV afterload
\u2022 Dobutamine: cautiously (\u2191 myocardial O\u2082 demand in ischemia \u2014 low dose)
\u2022 Avoid tachycardia: \u2193 diastolic filling \u2192 \u2193 graft perfusion
\u2022 Target MAP 70\u201380 for graft perfusion pressure`,warn:"New ST elevation in a specific distribution post-CABG is graft failure until proven otherwise. Troponin peaks in the first 24h routinely after CPB \u2014 a RISING or dramatically elevated troponin (> 10\xD7 normal) suggests graft ischemia, not just surgical release."}].map((i,r)=>(0,o.jsxs)("div",{style:{marginBottom:8},children:[(0,o.jsxs)("div",{onClick:()=>t(e===r?null:r),style:{background:"rgba(255,255,255,0.04)",border:`1px solid ${e===r?i.color:"rgba(255,255,255,0.1)"}`,borderRadius:10,padding:12,cursor:"pointer",display:"flex",justifyContent:"space-between",alignItems:"center"},children:[(0,o.jsxs)("div",{style:{display:"flex",gap:10,alignItems:"center"},children:[(0,o.jsx)("span",{style:{fontSize:18},children:i.icon}),(0,o.jsx)("span",{style:{color:i.color,fontWeight:700,fontSize:13},children:i.name})]}),(0,o.jsx)("span",{style:{color:"#546e7a"},children:e===r?"\u25B2":"\u25BC"})]}),e===r&&(0,o.jsxs)("div",{style:{background:"rgba(255,255,255,0.02)",border:`1px solid ${i.color}44`,borderRadius:"0 0 10px 10px",borderTop:"none",padding:14},children:[(0,o.jsx)(I,{children:"Hemodynamic Profile"}),(0,o.jsx)("div",{style:{display:"grid",gap:6,marginBottom:12},children:i.profile.map(([a,l,s],d)=>(0,o.jsxs)("div",{style:{display:"grid",gridTemplateColumns:"140px 1fr 1fr",gap:8,fontSize:11},children:[(0,o.jsx)("div",{style:{color:"#80deea",fontWeight:700},children:a}),(0,o.jsx)("div",{style:{color:"#cfd8dc"},children:l}),(0,o.jsx)("div",{style:{color:"#90a4ae",fontStyle:"italic"},children:s})]},d))}),(0,o.jsx)(I,{children:"Management"}),(0,o.jsx)("p",{style:{color:"#b2dfdb",fontSize:11.5,lineHeight:1.8,margin:"0 0 8px",whiteSpace:"pre-line"},children:i.tx}),i.extra&&(0,o.jsxs)("div",{style:{background:`rgba(${i.extra.color==="#ef9a9a"?"239,83,80":"0,188,212"},0.07)`,border:`1px solid ${i.extra.color}44`,borderRadius:8,padding:14,marginTop:10},children:[(0,o.jsxs)("div",{style:{color:i.extra.color,fontWe ng temperature context causes harm."},{q:"Chest tubes drain 250 mL/hr for 2 consecutive hours post-CABG. CVP is falling. What is the primary hemodynamic concern?",opts:["Cardiac tamponade \u2014 CVP should be rising","Hypovolemic shock from mediastinal bleeding","Post-bypass vasoplegia","Acute RV failure"],ans:1,exp:"Falling CVP + high chest tube output = hypovolemic shock from active bleeding. Tamponade causes RISING CVP (pericardial compression). Active drainage = volume loss, not compression."},{q:"Post-AVR: MAP 46, CI 3.4, SVR 420, SvO\u2082 78%. IVF not working. What is this and what's the treatment?",opts:["Cardiogenic shock \u2014 start dobutamine","Post-bypass vasoplegia \u2014 start norepinephrine","Cardiac tamponade \u2014 call surgeon","Hypovolemic shock \u2014 give more fluids"],ans:1,exp:"HIGH CI + LOW SVR = vasoplegia, not cardiogenic shock. Norepinephrine (\u03B11) restores SVR. Dobutamine/milrinone would worsen vasodilation. Fluids don't fix a vascular tone problem."},{q:"After MVR, CVP is 17 mmHg rising while PA diastolic is 13 mmHg. CI is 1.8 and falling. What chamber is failing?",opts:["Left ventricle \u2014 add dobutamine","Right ventricle \u2014 add milrinone","Biventricular \u2014 start epinephrine","Normal post-MVR physiology"],ans:1,exp:"CVP >> PA diastolic = RV dilating and backing up (\u2191CVP) but not filling left heart (PA diastolic normal). This is acute RV failure. Milrinone = RV inotrope + pulmonary vasodilator. Do NOT give fluid."},{q:"The hemodynamic signature of cardiac tamponade on PA monitoring is:",opts:["CVP \u2191\u2191, PA diastolic \u2193\u2193, CI \u2191","Pressure equalization: CVP \u2248 PA diastolic \u2248 RVP diastolic","CVP \u2193, SVR \u2191\u2191, CI \u2193\u2193","CVP \u2191, PA diastolic \u2193, PVR \u2191\u2191"],ans:1,exp:"Pericardial compression raises all four chamber pressures equally. CVP \u2248 PA diastolic \u2248 RVP diastolic is pathognomonic for tamponade."},{q:"Epinephrine at < 0.03 mcg/kg/min primarily acts as:",opts:["A pure vasopressor (\u03B11 dominant)","An inotrope (\u03B21 dominant \u2014 similar to dobutamine)","A pulmonary vasodilator (\u03B22 dominant)","A balanced vasoconstrictor + inotrope"],ans:1,exp:"At low doses (< 0.03 mcg/kg/min), epi is predominantly \u03B21 \u2014 it functions as an inotrope similar to dobutamine. The \u03B11 vasopressor effect becomes dominant only at higher doses (> 0.1 mcg/kg/min). This dose-dependent shift is clinically important."},{q:"Dopamine at 1\u20133 mcg/kg/min is used primarily for:",opts:["Vasopressor effect via \u03B11 receptors","Renal and splanchnic perfusion via dopaminergic (DA1/DA2) receptors","Inotropic effect via \u03B21 receptors","Pulmonary vasodilation via \u03B22 receptors"],ans:1,exp:"At 1\u20133 mcg/kg/min (dopaminergic range), dopamine stimulates DA1/DA2 receptors \u2192 \u2191 renal and splanchnic blood flow, \u2191 UOP. \u03B21 inotrope effect dominates at 3\u201310 mcg/kg/min. \u03B11 vasopressor at > 10 mcg/kg/min."},{q:"Which pacing mode is preferred post-cardiac surgery when both RA and RV epicardial wires are functional?",opts:["VVI (ventricular demand only)","DDD (AV sequential \u2014 dual chamber)","DOO (asynchronous)","AAI (atrial demand only)"],ans:1,exp:"DDD preserves AV synchrony and atrial kick (15\u201325% of CO). Critically important in patients with diastolic dysfunction (post-AVR-AS, stiff LV). VVI is used only when atrial wires are non-functional or in AF."},{q:"TEG shows: prolonged R-time, prolonged K-time, low alpha angle, low MA. What blood products are indicated?",opts:["PRBCs only \u2014 hemoglobin is the priority","FFP (factor deficiency) + Cryo/fibrinogen concentrate (fibrinogen) + Platelets (MA)","Platelets only \u2014 the MA is what matters","Fresh whole blood \u2014 replaces everything at once"],ans:1,exp:"Prolonged R-time = factor deficiency \u2192 FFP. Prolonged K-time + low alpha angle = fibrinogen deficiency \u2192 Cryo or fibrinogen concentrate. Low MA = platelet dysfunction or low count \u2192 platelets. TEG guides targeted product selection \u2014 not a cookbook, but a roadmap."},{q:"A post-CABG patient has HR 115 bpm (POAF). Before giving metoprolol IV, the MOST important parameter to check is:",opts:["Temperature","Cardiac index (CI)","Urine output","Chest tube output"],ans:1,exp:"Beta-blockers reduce HR but also \u2193 contractility. If CI is already low (< 2.2), slowing the HR further can precipitate LCOS. Always confirm CI is adequate before rate control with negative inotropes."},{q:"A post-op stroke is suspected after CABG. Blood pressure is MAP 82 (SBP ~120). What is the correct BP management for the first 24 hours?",opts:["Aggressively lower BP to MAP < 65 immediately","Maintain permissive hypertension (MAP 70\u201390) to support ischemic penumbra perfusion","Give nicardipine to achieve MAP < 60","BP does not matter \u2014 only neurologic protection matters"],ans:1,exp:"In ischemic stroke, permissive hypertension (MAP 70\u201390) maintains perfusion to the ischemic penumbra (at-risk but viable tissue). Aggressive BP lowering worsens ischemia. This is the OPPOSITE of normal post-CABG BP targets. Neurology + surgery joint decision for anticoagulation."},{q:"Normal RSBI threshold for SBT success is:",opts:["< 50 f/VT","< 105 f/VT","< 150 f/VT","< 80 f/VT only \u2014 80\u2013105 always fails"],ans:1,exp:"RSBI < 105 = SBT success predicted. < 80 = high confidence. 80\u2013105 = borderline, use full clinical picture. > 105 = high failure risk. Formula: RR (breaths/min) \xF7 VT (in liters)."},{q:"Which electrolyte targets are most important for preventing post-op atrial fibrillation (POAF)?",opts:["Na\u207A \u2265 135 and Ca\xB2\u207A \u2265 8.5","K\u207A \u2265 4.0 mEq/L and Mg\xB2\u207A \u2265 2.0 mg/dL","Phosphate \u2265 2.5 and Albumin \u2265 3.0","Glucose < 180 and Hgb \u2265 10"],ans:1,exp:"Hypokalemia and hypomagnesemia are primary drivers of POAF post-cardiac surgery. Aggressively replete K\u207A \u2265 4.0 and Mg\xB2
