 and constricted \u2014 the heart has to push very hard to move blood through. Low SVR: the pipes are floppy and dilated \u2014 blood flows easily but pressure drops and circulation becomes inefficient.","Normal SVR is 800\u20131,200. At 22:00, The patient\u2019s SVR was 719. Her blood vessels had lost their tone \u2014 this is called vasoplegia, common after heart bypass surgery. The bypass machine triggers an inflammatory response that relaxes blood vessels. Norepinephrine helps, but sometimes the inflammation blocks that pathway. Then you need vasopressin \u2014 a completely different receptor (V1) that the inflammation hasn\u2019t blocked.","This is why vasopressin was started before dobutamine: the vessel problem (SVR 719) was identified first. Fixing the nozzle with the right tool before adding pump support means the pump works more efficiently and the heart isn\u2019t taxed unnecessarily."],remember:"Low SVR + low CI = need both the afterload pouch AND contractility pouch tools. But open the afterload pouch first \u2014 fixing vessel tone reduces the strain on the pump before you ask it to work harder with inotropes."}),React.createElement(Bl,{icon:"\u{1FA23}",title:"CVP \u2014 Central Venous Pressure",simple:"How full is the tank on the right side?",paragraphs:["CVP measures the pressure of blood returning to the right side of the heart \u2014 a rough gauge of how full the \u2018tank\u2019 is. Normal is 2\u20138 mmHg. Higher means more volume in the system; lower means the tank is running low.","Here is the critical nuance for the patient: because her heart wall is thick and stiff (severe concentric hypertrophy), it needs MORE volume to stretch and function than a normal heart. A CVP of 12 that would be fine for a normal heart is actually too low for hers. She needed 14\u201318 to work efficiently. This is called being preload-dependent.","Only one albumin was given during the afternoon. For this specific patient, that wasn\u2019t enough to fill the tank to  reaction protocol active, all steps done in correct order \u2014 while everything else was happening simultaneously.",why:"Hgb 7.6 means the blood\u2019s oxygen-carrying capacity is critically reduced. Every heartbeat was delivering less oxygen than it should because the hemoglobin trucks were too few and too empty. Getting the transfusion running correctly and quickly restored that capacity. Executing a full transfusion protocol while managing a deteriorating patient is a real clinical skill."}),React.createElement(ti,{time:"04:30",title:"Drew a mixed venous gas overnight to track recovery",what:"Instead of waiting for morning labs to know if the interventions were working, a mixed venous gas was drawn overnight to check SvO\u2082 directly.",why:"If SvO\u2082 had stayed at 44% despite all the interventions, further escalation would have been needed. Checking during the night rather than waiting until morning gave the team real data while there was still time to act on it. This is proactive monitoring \u2014 a step beyond reactive management."}),React.createElement(ti,{time:"05:00",title:"SpO\u2082 88% \u2014 escalated immediately to high-flow nasal cannula",what:"When the oxygen saturation dropped, Dana escalated to high-flow nasal cannula (15L then 13L) without hesitation or delay.",why:"When a patient\u2019s cardiac output is still recovering, hard breathing burns oxygen the heart and organs need. A SpO\u2082 drop in this setting doesn\u2019t just affect the lungs \u2014 it worsens the whole oxygen delivery picture the team had been working all night to improve. Fast recognition and quick action protected that recovery."}),React.createElement("div",{style:{background:_.greenBg,border:"1px solid "+_.greenBdr,borderRadius:10,padding:14,marginTop:10}},React.createElement("div",{style:{color:_.green,fontWeight:700,fontSize:12,marginBottom:8}},"By 06:00"),React.createElement("p",{style:{color:_.sec,fontSize:12,lineHeight:1.85,margin:0}},"SvO\u2082 71%. CO 3.2. MAP 72
