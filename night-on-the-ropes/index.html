,["50\u201355%","Concerning \u2014 near maximum extraction",T.amber],["< 50%","Critical \u2014 anaerobic metabolism likely",T.red]]},remember:"A falling SvO\u2082 trend is more important than any single value. When you see 68 \u2192 62 \u2192 58 \u2192 52 over four hours, the slope is telling you something even before any one number looks catastrophic."}),(0,P.jsx)(Fl,{icon:"\u2764\uFE0F",title:"Cardiac Index (CI) \u2014 How Much Blood the Heart Is Pumping",simple:"The pump output, adjusted for body size",paragraphs:["Cardiac output (CO) is how many liters of blood the heart pumps per minute. We divide it by body surface area to get the Cardiac Index (CI) \u2014 so the number is fair regardless of how big or small the patient is. Normal CI is 2.2\u20134.0 L/min/m\xB2.","When The patient\u2019s CI was 1.0 at midnight, her heart was pumping less than half the minimum it should. For her body size, that is a critically low flow state \u2014 not enough blood reaching the organs to keep cells alive without switching to emergency mode.","Low CI alone doesn\u2019t tell you WHY the pump is struggling. That\u2019s what the SVR, CVP, and SvO\u2082 help you figure out. You need all the numbers together."],table:{title:"The patient\u2019s CI through the shift:",rows:[["19:00 (handoff)","1.7 \u2014 low-normal, already struggling",T.amber],["22:00","1.2 \u2014 significantly low",T.red],["00:00","1.0 \u2014 critical, less than half of minimum normal",T.red],["06:00","3.2 \u2014 recovering, first time normal all day","#14532d"]]},remember:"CI tells you the pump is struggling. SVR, CVP, SvO\u2082, and the labs tell you WHY \u2014 and which tool pouch to open."}),(0,P.jsx)(Fl,{icon:"\u{1F6B0}",title:"SVR \u2014 Systemic Vascular Resistance",simple:"How tight or floppy are the blood vessels?",paragraphs:["Picture the blood vessels as a network of pipes. SVR is how much resistance the blood meets as it flows through them. High SVR: the pipes are tight and constricted \u2014 the heart has to push very hard to move blood through. Low SVR: the pipes are floppy and dilated \u2014 blood flows easily but pressure drops and circulation becomes inefficient.","Normal SVR is 800\u20131,200. At 22:00, The patient\u2019s SVR was 719. Her blood vessels had lost their tone \u2014 this is called vasoplegia, common after heart bypass surgery. The bypass machine triggers an inflammatory response that relaxes blood vessels. Norepinephrine helps, but sometimes the inflammation blocks that pathway. Then you need vasopressin \u2014 a completely different receptor (V1) that the inflammation hasn\u2019t blocked.","This is why vasopressin was started before dobutamine: the vessel problem (SVR 719) was identified first. Fixing the nozzle with the right tool before adding pump support means the pump works more efficiently and the heart isn\u2019t taxed unnecessarily."],remember:"Low SVR + low CI = need both the afterload pouch AND contractility pouch tools. But open the afterload pouch first \u2014 fixing vessel tone reduces the strain on the pump before you ask it to work harder with inotropes."}),(0,P.jsx)(Fl,{icon:"\u{1FA23}",title:"CVP \u2014 Central Venous Pressure",simple:"How full is the tank on the right side?",paragraphs:["CVP measures the pressure of blood returning to the right side of the heart \u2014 a rough gauge of how full the \u2018tank\u2019 is. Normal is 2\u20138 mmHg. Higher means more volume in the system; lower means the tank is running low.","Here is the critical nuance for the patient: because her heart wall is thick and stiff (severe concentric hypertrophy), it needs MORE volume to stretch and function than a normal heart. A CVP of 12 that would be fine for a normal heart is actually too low for hers. She needed 14\u201318 to work efficiently. This is called being preload-dependent.","Only one albumin was given during the afternoon. For this specific patient, that wasn\u2019t enough to fill the tank to the level her heart needed. The preload tool pouch had barely been opened all day."],remember:"Always interpret CVP in the context of the patient\u2019s heart. Diastolic dysfunction = stiff heart = needs a higher CVP. A number that looks \u2018normal\u2019 might actually be too low for this specific patient."}),(0,P.jsx)(Fl,{icon:"\u2697\uFE0F",title:"Metabolic Acidosis \u2014 The Cellular Distress Signal",simple:"What happens inside cells when they run out of oxygen",paragraphs:["Your cells need oxygen to produce energy efficiently. When oxygen delivery drops too low, cells switch to an emergency backup called anaerobic metabolism \u2014 it works without oxygen but produces lactic acid as a byproduct.","That acid accumulates in the blood, making it more acidic. We measure this with the Base Excess (BE). Normal is close to zero. Negative values mean more acid than normal. The patient\u2019s BE was -4 at handoff and -7 by midnight \u2014 her cells had been running on emergency power for hours, probably since the afternoon when oxygen delivery first started falling.","The acid creates a vicious cycle: acidosis impairs how calcium moves inside heart muscle cells. Without proper calcium cycling, the muscle can\u2019t contract as strongly \u2014 which worsens output \u2014 which worsens oxygen delivery \u2014 which makes more acid. This is why sodium bicarbonate and calcium chloride overnight weren\u2019t just \u2018fixing labs\u2019 \u2014 they were directly unlocking the heart\u2019s ability to respond to everything else."],remember:"A worsening base excess in a post-CABG patient is the body recording hours of inadequate oxygen delivery in chemical form. The longer it goes, the harder the recovery. The goal is to catch the trend at -3 or -4, not wait until -7."}),(0,P.jsx)(Fl,{icon:"\u{1FA78}",title:"Hemoglobin \u2014 The Oxygen-Carrying Capacity",simple:"Red blood cells are the delivery trucks \u2014 hemoglobin is the cargo space",paragraphs:["Hemoglobin (Hgb) is the protein inside red blood cells that carries oxygen. Think of it as how many cargo slots each delivery truck has. Normal Hgb is around 12\u201316 g/dL. After heart surgery it drops \u2014 from the bypass machine diluting the blood, surgical blood loss, and ongoing drainage.","Oxygen delivery = Cardiac Output \xD7 oxygen content of blood. If hemoglobin drops, each heartbeat delivers less oxygen \u2014 even if the CI stays the same. When The patient\u2019s Hgb dropped to 7.6, the trucks were half-empty. A blood transfusion doesn\u2019t just replace volume \u2014 it restores the oxygen-carrying capacity of every beat the heart pumps.","We typically transfuse when Hgb falls below 8.0 in post-cardiac surgery patients who are already hemodynamically unstable. With EBL 500 mL in surgery, CPB dilution, and three chest tubes draining overnight, this drop was predictable from the start of the shift."],remember:"Low hemoglobin + low cardiac output = a double hit on oxygen delivery. The CI might look marginally okay, but if the blood is too thin to carry enough oxygen, the tissues are still being starved. Always look at Hgb and CI together."}),(0,P.jsx)(CR,{children:"The belt-bag framework is a way to organize your thinking when a patient is struggling. Before reaching for any tool: which component is the problem \u2014 the fill (preload), the squeeze (contractility), or the resistance (afterload)? Check all three. Open the right pouch. Choose the right tool. Sometimes all three pouches at once. That is the whole framework."})]}),e==="nurse"&&(0,P.jsxs)("div",{children:[(0,P.jsx)("div",{style:{background:T.goldBg,border:"1px solid "+T.goldBdr,borderRadius:10,padding:14,marginBottom:18,fontSize:12,lineHeight:1.8,color:T.sec},children:"Dana had coaching and support alongside her that night \u2014 but coaching can only help someone who is paying attention, reading the numbers, and executing correctly. Every action below was hers."}),(0,P.jsx)(ri,{time:"21:00\u201322:00",title:"Recognized the deterioration early and escalated",what:"The MAP flagged at 42 on the arterial line and the SvO\u2082 was declining. Dana communicated the trend clearly, with the numbers, and escalated in time for intervention \u2014 before the CI hit 1.0.",why:"Recognizing a declining trend and acting on it before a crisis is more valuable than reacting after one. The window that allowed vasopressin to be ordered at 22:30 \u2014 before the true nadir \u2014 was created by this early escalation."}),(0,P.jsx)(ri,{time:"22:00",title:"Identified two separate problems: low output AND low vascular tone",what:"When CI 1.2 came back alongside SVR 719, Dana identified this correctly \u2014 not just a weak pump, but also blood vessels that had lost their tone. Two different problems needing tools from two different pouches.",why:"This distinction changes everything. Reaching straight for dobutamine (a contractility tool) when SVR is 719 would add output to a system that can\u2019t maintain pressure \u2014 and would make the heart work harder unnecessarily. Vasopressin (an afterload tool) was the right first move. Getting this right was excellent clinical reasoning for any nurse, let alone someone still new to ICU."}),(0,P.jsx)(ri,{time:"22:30",title:"Implemented vasopressin and methylprednisolone promptly and correctly",what:"Both orders were verified and running quickly. The steroid (methylprednisolone) was an important addition: after bypass surgery some patients\u2019 stress response is blunted, contributing to why vasopressors don\u2019t work as well. The steroid helps restore that response.",why:"Speed of implementation matters enormously in a patient with MAP 42. Every 15\u201330 minutes of delay is more time the organs spend underperfused. Correct, prompt execution is a core nursing skill that directly affects outcomes."}),(0,P.jsx)(ri,{time:"00:00\u201300:23",title:"Flagged CI 1.0 and SvO\u2082 44% and triggered dobutamine",what:"When the cardiac index printed at 1.0 and the SvO\u2082 was 44%, Dana recognized the gravity immediately, communicated clearly, and dobutamine was ordered within 23 minutes.",why:"CI 1.0 is critically low. Twenty-three minutes from identifying it to dobutamine verified and running is the kind of responsiveness that changes patient outcomes. At CI 1.0, every minute of delay allows more acid to build and more cellular damage to accumulate."}),(0,P.jsx)(ri,{time:"00:40",title:"Connected the acidosis to the heart\u2019s ability to function",what:"When base excess came back at -7, Dana understood this wasn\u2019t just a number to trend \u2014 the acid was actively weakening every heartbeat by impairing how calcium works inside the heart muscle. Bicarb was treatment for the pump, not just a lab correction.",why:"At pH 7.32 and BE -7, the heart\u2019s contractile machinery is chemically impaired. Correcting the acid is like clearing the road so the dobutamine and other treatments can actually work. This is a connection that many experienced nurses take years to make."}),(0,P.jsx)(ri,{time:"00:41",title:"Caught K\u207A 6.0 in the middle of everything else and got it treated",what:"While managing multiple drips, flagging vitals, and coordinating a blood transfusion, Dana caught K\u207A 6.0 on the labs and escalated for treatment without losing the thread on everything else happening.",why:"Hyperkalemia at 6.0 destabilizes the heart\u2019s electrical activity. In a heart already struggling with low output and acidosis, high potassium is a direct threat to contractility and rhythm. This is not a morning lab. It was caught and treated in the middle of the night while a patient was deteriorating around it."}),(0,P.jsx)(ri,{time:"01:15\u201301:24",title:"Organized the full PRBC transfusion workflow efficiently",what:"Type and screen, crossmatch, peripheral IV placed, informed consent obtained, temperature verified, transfusion reaction protocol active, all steps done in correct order \u2014 while everything else was happening simultaneously.",why:"Hgb 7.6 means the blood\u2019s oxygen-carrying capacity is critically reduced. Every heartbeat was delivering less oxygen than it should because the hemoglobin trucks were too few and too empty. Getting the transfusion running correctly and quickly restored that capacity. Executing a full transfusion protocol while managing a deteriorating patient is a real clinical skill."}),(0,P.jsx)(ri,{time:"04:30",title:"Drew a mixed venous gas overnight to track recovery",what:"Instead of waiting for morning labs to know if the interventions were working, a mixed venous gas was drawn overnight to check SvO\u2082 directly.",why:"If SvO\u2082 had stayed at 44% despite all the interventions, further escalation would have been needed. Checking during the night rather than waiting until morning gave the team real data while there was still time to act on it. This is proactive monitoring \u2014 a step beyond reactive management."}),(0,P.jsx)(ri,{time:"05:00",title:"SpO\u2082 88% \u2014 escalated immediately to high-flow nasal cannula",what:"When the oxygen saturation dropped, Dana escalated to high-flow nasal cannula (15L then 13L) without hesitation or delay.",why:"When a patient\u2019s cardiac output is still recovering, hard breathing burns oxygen the heart and organs need. A SpO\u2082 drop in this setting doesn\u2019t just affect the lungs \u2014 it worsens the whole oxygen delivery picture the team had been working all night to improve. Fast recognition and quick action protected that recovery."}),(0,P.jsxs)("div",{style:{background:T.greenBg,border:"1px solid "+T.greenBdr,borderRadius:10,padding:14,marginTop:10},children:[(0,P.jsx)("div",{style:{color:T.green,fontWeight:700,fontSize:12,marginBottom:8},children:"By 06:00"}),(0,P.jsx)("p",{style:{color:T.sec,fontSize:12,lineHeight:1.85,margin:0},children:"SvO\u2082 71%. CO 3.2. MAP 72. Vasopressin weaning. Norepinephrine off. The patient who was handed off at 07:00 was in a completely different place from the one who had been drifting into oxygen debt since the afternoon. Dana didn\u2019t just manage a deteriorating patient \u2014 she turned one around. That is the work."})]})]}),e==="lookback"&&(0,P.jsxs)("div",{children:[(0,P.jsxs)("div",{style:{background:T.blueBg,border:"1px solid "+T.blueBdr,borderRadius:10,padding:14,marginBottom:16},children:[(0,P.jsx)("div",{style:{color:T.blue,fontWeight:700,fontSize:12,marginBottom:6},children:"Before reading this section"}),(0,P.jsx)("p",{style:{color:T.sec,fontSize:12,lineHeight:1.8,margin:0},children:"This is not about pointing fingers. The nurses who cared for the patient during the afternoon were managing a freshly extubated post-CABG patient who appeared to be holding on the surface. Many of the signals discussed here are subtle and easy to overlook in a busy ICU. This section is purely forward-looking: these are the patterns to carry with you so that the next time a similar patient comes through, you recognize the signals earlier."})]}),(0,P.jsx)("div",{style:{color:T.text,fontWeight:700,fontSize:13,marginBottom:12,borderLeft:"3px solid "+T.blueBdr,paddingLeft:10},children:"What the Afternoon Numbers Were Already Saying"}),(0,P.jsx)(Ch,{num:1,title:"The SvO\u2082 slope \u2014 a slow-motion warning",signal:"SvO\u2082 fell from 71% at noon to 52% at handoff \u2014 approximately 3 points per hour, every hour, without stopping.",context:"No single number crossed a hard threshold dramatically. But the slope was telling a story: the body was progressively extracting more and more oxygen from each unit of blood flow. That\u2019s not noise \u2014 that\u2019s a trend. Left unaddressed, it leads to exactly the overnight crisis that occurred.",pattern:"When SvO\u2082 falls steadily over 2\u20133 hours \u2014 even if each individual number seems borderline acceptable \u2014 the direction is the data. A chart showing 71-68-62-61-58-55 is a different clinical reality from a chart showing 65-65-66-65.",tip:"SvO\u2082 is a trend metric, not a spot check. When you see a directional decline over several hours, ask: why is it falling? Which tool pouch hasn\u2019t been opened yet?"}),(0,P.jsx)(Ch,{num:2,title:"The preload tools were underused for this specific heart",signal:"Only one albumin given during the afternoon. CVP sitting at 12 when this heart needed 14\u201318. SvO\u2082 declining as a consequence.",context:"The patient\u2019s thick, stiff heart wall is preload-dependent \u2014 it needs a fuller tank than a normal heart to function efficiently. Albumin after bypass surgery is particularly useful because it stays in the bloodstream (unlike saline which leaks into tissues). One albumin for a patient like this, over an entire afternoon, is not enough.",pattern:"Post-CABG patients with documented diastolic dysfunction and severe concentric hypertrophy need aggressive preload management from the start, not just when the CI drops. The preload pouch tools should have been used more actively.",tip:"When you receive a post-CABG patient with known diastolic dysfunction, ask in your handoff: what is this heart\u2019s CVP target? If it\u2019s sitting lower than 14 and SvO\u2082 is declining, open the preload pouch \u2014 albumin, not just saline."}),(0,P.jsx)(Ch,{num:3,title:"The hemoglobin drop was predictable",signal:"Hgb 9.9 on arrival from OR. EBL 500 mL. Three chest tubes draining. CPB dilution.",context:"With that starting point and those ongoing losses, Hgb below 8.0 by midnight was almost mathematically certain. The transfusion ended up happening at 01:15, by which point CI was already 1.0 and SvO\u2082 was 44%.",pattern:"Post-cardiac surgery anemia follows a predictable trajectory when you know the starting Hgb, the blood loss, and the ongoing drainage. The endpoint can be estimated and acted on early.",tip:"For complex post-CABG patients with significant blood loss and ongoing drainage, check a hemoglobin during the evening shift \u2014 not in response to a crisis. A proactive transfusion at Hgb 8.2 at 21:00 is a very different s
