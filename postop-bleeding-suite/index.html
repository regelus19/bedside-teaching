oops \u2014 a fluid-filled loop raises the pressure needed to drain and falsely lowers your numbers.","Stripping / milking tubes is surgeon-dependent \u2014 some CTS are fine with it, others aren't (high negative pressure can damage tissue). Don't freelance: clear an obstructing clot per unit policy, and verify the approach with the MD, charge nurse, or an experienced CVICU RN who knows that surgeon's preference.","Don't clamp chest tubes for transport or ambulation unless ordered \u2014 keep to water seal; clamping risks tension.","Know your suction setting, confirm the water seal, and watch tidaling (working) vs continuous bubbling (air leak).","Always have an hourly total ready \u2014 it tells you how negative the patient is and how much you have to catch up on. The CVICU drain flowsheet gives you that snapshot at a glance."]},{id:"read",icon:Et,color:i.navy,title:"Read the patient, not just the drain",tips:["First, make sure bleeding is the story \u2014 these reads assume hypovolemia / hemorrhage. A primary pump problem (low EF / low cardiac output syndrome) or vasoplegia gives the same low BP but a different profile; check filling pressures, EF / CO, and SVR before treating it as a bleed.","Pressor creep is the quiet early tell \u2014 needing more norepi / vaso to hold the same MAP.","Rising CVP + falling BP + narrowing pulse pressure = tamponade physiology until proven otherwise.","Falling SvO\u2082 + rising lactate = dropping cardiac output. Oliguria and cool, mottled skin say the same thing.","Bright red, brisk, non-slowing drainage leans surgical; diffuse dark ooze from many sites leans coagulopathy."]},{id:"basics",icon:aa,color:i.teal,title:"Fix the reversible basics first",tips:["Rewarm aggressively \u2014 a cold patient won't clot no matter how much plasma you hang.","Treat hypertension promptly \u2014 pressure pops fresh suture lines. Control pain, agitation, and shivering.","Check and replace ionized calcium, especially during rapid transfusion. Banked products carry citrate (an additive that keeps the bag from clotting by binding calcium); transfuse fast and that citrate binds the patient's calcium too, dropping iCa quickly.","Keep them calm \u2014 coughing, bucking, and Valsalva all spike intrathoracic pressure."]},{id:"pressors",icon:zt,color:i.mixed,title:"Pressors as a bridge \u2014 Levophed & vasopressin",tips:["Pressors buy time \u2014 they hold perfusion pressure while you replace volume and the blood products catch up to the deficit. They don't fix the bleeding or the volume; keep treating the cause underneath.","Norepinephrine (Levophed) is your titratable workhorse \u2014 fast on, fast off \u2014 so it's the agent you 'play with' to fine-tune pressure minute to minute.","As Levophed climbs toward ~0.1 mcg/kg/min, start thinking about a second agent rather than just pushing the Levophed higher \u2014 that's the cue to add vasopressin.","Vasopressin here is a fixed basal dose, not a titrated drip. At our facility and for our patient population the ceiling is 0.04 units/min. Run as a steady basal dose \u2014 it's catecholamine-sparing, so you need less Levophed.","Give vasopressin time \u2014 it has about a 10-minute lag before you see the effect. Don't chase it or stack changes in the first few minutes expecting an immediate response.","Watch for overshoot \u2014 once both agents work together they can drive pressure higher than you want in a recovering heart. A pressure spike from over-using pressors can stress fresh suture lines and graft anastomoses and cause an anastomotic leak / suture-line disruption \u2014 meaning more bleeding. Keep vasopressin low and fixed, and titrate the shorter-acting Levophed to dial the pressure in without overshooting.","Doses and titration always follow the provider order and unit protocol \u2014 these are our typical practice points, not a standing order."]},{id:"transfuse",icon:Xe,color:i.act3,title:"Replacing blood \u2014 deliver it fast",tips:["When you're replacing blood, speed matters \u2014 use pressure bags to push products in quickly and catch up on the negative fluid balance.","Don't run blood products on an IV pump \u2014 it's too slow and you'll keep falling behind the deficit.","Use blood tubing you can manually pump (with a pressure bag) so you can drive products in fast when the patient is behind.","Be ready to give multiple products at the same time \u2014 set up more than one line so you're not running one slow unit after another.","Follow facility transfusion and patient-ID policy."]},{id:"ready",icon:Da,color:i.act1,title:"Be ready before you need to be",tips:["Send the right labs early and trend them: CBC / platelets, fibrinogen, PT/PTT, ionized calcium (\xB1 TEG).","Keep an active type & cross; know where the cooler and products are.","Stay ahead with the blood bank \u2014 ask them to keep ~2 units of each product ready, and give them a heads-up to thaw cryo / FFP and have platelets up early. Thawing takes time; the worst delay is waiting on a product you could have asked for 20 minutes ago.","Confirm two reliable large-bore access points.","Know where the reopening tray / sternal saw is and your unit's emergency chest-reopen process \u2014 before you need it.","Be ready to get consent signed for a chest re-exploration \u2014 have the paperwork in hand early so it isn't the bottleneck once the decision is made.","Stack all the IV pumps on one IV pole so the patient is ready to roll the moment the OR team arrives \u2014 don't wait to consolidate lines during the rush."]},{id:"escalate",icon:ta,color:i.coag,title:"Escalate early \u2014 and escalate a trend",tips:["Don't sit on a rising trend hoping it tapers \u2014 loop in the APP / surgeon / intensivist early.","FYI on PEEP: raising PEEP to 'tamponade' mediastinal bleeding is not supported by current evidence \u2014 controlled studies show it doesn't reduce blood loss and it can hurt hemodynamics (worse in patients with low cardiac reserve). Don't count on it as a hemostatic measure.","Hand off a story, not a number: output trend + character, vitals & pressor doses, CVP, latest H&H / fibrinogen / INR-PTT / iCa, temp, and what you've already corrected.","Document times, outputs, interventions, and who you notified."]},{id:"fooled",icon:Le,color:i.mixed,title:`Three "don't get fooled" reminders`,tips:["Low chest tube output \u2260 low bleeding \u2014 blood can pool in the pleural space or pericardium (suspect with a widened mediastinum, dropping breath sounds, or rising peak pressures).","Normal coags + ongoing bleeding usually means a surgical source \u2014 not a reason to keep transfusing.","Persistent bleeding after warmth, calcium, and appropriate products should raise surgical suspicion \u2014 not another round of guessing."]}];function Dm(){let[e,t]=(0,ae.useState)("drains");return(0,n.jsxs)("div",{children:[(0,n.jsx)(ce,{icon:Ha,kicker:"PRACTICAL PEARLS",title:"Bedside tips",color:i.teal}),(0,n.jsx)("p",{className:"body",style:{fontSize:13.5,color:i.sub,lineHeight:1.6,margin:"0 0 14px"},children:"Quick, practical things to share at the bedside \u2014 the stuff that catches new grads off guard. A starter set; we'll keep building it."}),(0,n.jsx)("div",{style:{display:"grid",gap:11},children:Fm.map(a=>{let o=e===a.id;return(0,n.jsxs)("div",{style:{border:`1px solid ${i.line}`,borderRadius:14,background:"#fff",overflow:"hidden"},children:[(0,n.jsxs)("button",{onClick:()=>t(o?"":a.id),style:{width:"100%",display:"flex",alignItems:"center",gap:11,padding:"13px 14px",background:o?`${a.color}0c`:"#fff",border:"none",cursor:"pointer",textAlign:"left"},children:[(0,n.jsx)("div",{style:{background:`${a.color}16`,borderRadius:9,padding:7,flexShrink:0},children:(0,n.jsx)(a.icon,{size:17,color:a.color})}),(0,n.jsx)("span",{className:"body",style:{flex:1,fontWeight:700,fontSize:14.5,color:i.ink},children:a.title}),o?(0,n.jsx)(Ea,{size:18,color:i.faint}):(0,n.jsx)(za,{size:18,color:i.faint})]}),o&&(0,n.jsx)("ul",{style:{margin:0,pa hes at 150)."},{q:"Fastest, safest way to deliver blood to catch up a volume deficit:",options:["On an IV pump at max rate","Gravity only","Pressure bag with manually-pumpable tubing, multiple lines","Slow push"],answer:2,why:"IV pumps are too slow \u2014 use pressure bags and more than one line, and be ready to run products simultaneously."},{q:"At our facility, vasopressin for this population is run as:",options:["A titratable drip up to 0.1 units/min","A fixed basal dose, max 0.04 units/min","PRN boluses","Only after epinephrine"],answer:1,why:"Fixed basal dose, ceiling 0.04 units/min \u2014 it's catecholamine-sparing, so you use less Levophed."},{q:"When should you start thinking about adding vasopressin to Levophed?",options:["As Levophed approaches ~0.1 mcg/kg/min","Only above 0.5 mcg/kg/min","Never combine them","Immediately at any dose"],answer:0,why:"Around 0.1 mcg/kg/min of Levophed is the cue to add a second agent rather than just pushing Levophed higher."},{q:"Vasopressin's effect:",options:["Is immediate","Has about a 10-minute lag before you see it","Takes about an hour","Is too unpredictable to wait"],answer:1,why:"~10-minute lag \u2014 give it time, don't chase it or stack changes in the first few minutes."},{q:"Why fine-tune pressure with Levophed rather than vasopressin?",options:["Vasopressin is stronger","Levophed is shorter-acting (fast on/off), easier to dial without overshoot","Vasopressin can be bolused","Levophed has no side effects"],answer:1,why:"Keep vasopressin low/fixed and titrate the shorter-acting Levophed to dial pressure in."},{q:"Overshooting BP with too much pressor in a fresh post-op heart risks:",options:["Hypoglycemia","Anastomotic leak / suture-line disruption \u2014 more bleeding","Hyperkalemia","Nothing significant"],answer:1,why:"A pressure spike stresses fresh suture lines and graft anastomoses; keep vaso fixed and titrate Levophed."},{q:"Rapid transfusion can drop ionized calcium because blood products contain:",options:
