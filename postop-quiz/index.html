ld show rising CVP with equalization of pressures. RV failure shows elevated CVP. Vasoplegia shows low SVR with warm extremities but normal/elevated CVP.",pearl:"\u{1F4CC} Low CVP + tachycardia + falling UOP = check the tank first. Pressors don't fix an empty ventricle.",escalation:"If no response to 250\u2013500 mL fluid challenge and UOP remains <20 mL/hr, notify surgeon and consider advanced hemodynamic monitoring."},{id:"L1-03",category:"Routine Post-Op",scenario:"Post-op CABG, 8 hrs. Patient on propofol drip. Vent settings: AC/VC, TV 480 (IBW 70 kg), RR 14, PEEP 5, FiO2 40%. SpO2 97%. ABG: pH 7.38, PaCO2 42, PaO2 88. MAP 70. Patient following commands when sedation lightened.",question:"What is the MOST appropriate next step in ventilator management?",options:["A. Increase PEEP to 10 due to post-op atelectasis risk","B. Begin spontaneous breathing trial / wean toward extubation","C. Switch to pressure control mode","D. Increase RR to reduce PaCO2"],answer:"B",rationale:"This patient meets standard criteria for SBT: hemodynamically stable MAP >65, adequate oxygenation on low FiO2, normal ABG, and is following commands. Early extubation (within 6\u20138 hrs) is the goal in fast-track cardiac surgery. Increasing PEEP or RR is not indicated with normal ABG.",pearl:"\u{1F4CC} Fast-track cardiac surgery targets extubation within 4\u20138 hours. Prolonged intubation increases VAP risk. If stable + following commands \u2192 start the wean.",escalation:"Delay extubation if hemodynamics require active titration of vasoactives, chest tube output >100 mL/hr, or mental status/airway protective reflexes inadequate."},{id:"L1-04",category:"Hemodynamics",scenario:"Post-op MVR, 10 hrs. MAP 68, HR 82, CVP 14, CI 2.4, SVR 980. UOP 55 mL/hr. Patient tolerating 2L O2 NC after extubation. No complaints.",question:"Which statement BEST describes this patient's hemodynamic profile?",options:["A. Low cardiac output with compensatory vasoconstriction","B. Vasoplegic shock requiring pressors","C. Adequate cardiac output with normal hemodynamics","D. Tamponade physiology with equalization of pressures"],answer:"C",rationale:"CI 2.4 (normal 2.2\u20134.0), SVR 980 (normal 800\u20131200), MAP 68, CVP 14 \u2014 all within acceptable post-op ranges. UOP is excellent. No signs of shock, tamponade, or vasoplegia. This is a well-perfusing, hemodynamically stable patient.",pearl:"\u{1F4CC} Normal CI: 2.2\u20134.0 L/min/m\xB2. Normal SVR: 800\u20131200 dynes\xB7sec/cm\u2075. When all parameters are within range and UOP is adequate \u2014 the patient is perfusing.",escalation:"CVP >18 with falling CI warrants reassessment for RV dysfunction, volume overload, or tamponade."},{id:"L1-05",category:"Bedside Pearls",scenario:"Post-op CABG, 3 hrs. MAP suddenly drops from 72 to 54 over 20 minutes. HR rises from 85 to 108. CVP rises from 8 to 16. Chest tube output abruptly stops. Patient becomes diaphoretic.",question:"This hemodynamic pattern MOST likely represents:",options:["A. Vasoplegic shock","B. Hypovolemia from bleeding","C. Cardiac tamponade","D. Post-op atrial fibrillation causing hemodynamic compromise"],answer:"C",rationale:"The classic Beck's triad analog in post-op tamponade: MAP falling + HR rising (compensatory) + CVP rising + ABRUPT CESSATION of chest tube output. The mediastinum is filling with blood not draining. This is a surgical emergency. Chest tube stripping / emergent reopening of chest may be required.",pearl:"\u{1F4CC} Sudden CVP rise + sudden chest tube output cessation + MAP drop = tamponade until proven otherwise. Call the surgeon IMMEDIATELY. Do not delay.",escalation:"IMMEDIATE surgeon notification. Prepare for bedside reopening. Do NOT give large fluid boluses as this temporarily elevates CVP but does not fix the problem."},{id:"L1-06",category:"Routine Post-Op",scenario:"Post-op CABG \xD7 4, 12 hrs. Extubated 2 hrs ago. Now complaining of palpitations. 12-lead shows irregularly irregular rhythm, HR 118, MAP 62. No P waves visible. Patient denies chest pain.",question:"This rhythm is MOST consistent with:",options:["A. Ventricular tachycardia","B. Post-operative atrial fibrillation (POAF)","C. Junctional rhythm","D. Second-degree AV block type II"],answer:"B",rationale:"Irregularly irregular rhythm without P waves at HR 118 post-cardiac surgery is classic post-operative atrial fibrillation (POAF). POAF occurs in 20\u201340% of post-CABG patients, peaking at 48\u201372 hrs. Ventricular tachycardia would show wide complex. Junctional has narrow regular rhythm. Second degree AV block would show dropped beats.",pearl:"\u{1F4CC} POAF peaks day 2\u20133 post-CABG. Risk increases with: advanced age, valve surgery, prior AF, electrolyte disturbances. Keep K >4.0, Mg >2.0.",escalation:"If MAP <60 with POAF \u2192 synchronized cardioversion. If hemodynamically stable \u2192 rate control (beta blocker, diltiazem) and anticoagulation discussion with surgeon."}],2:[{id:"L2-01",category:"Hemodynamics",scenario:"Post-op CABG, 4 hrs. MAP 58, HR 92 SR, CVP 4, CI 1.8, SVR 1,380. UOP decreasing to 22 mL/hr. Extremities cool. Chest tubes draining 30 mL/hr.",question:"What is the MOST appropriate NEXT step?",options:["A. Start norepinephrine 0.05 mcg/kg/min","B. Give 500 mL crystalloid bolus","C. Start dopamine for renal dosing","D. Begin diuresis with furosemide"],answer:"B",rationale:"Low CVP (4) + low CI (1.8) + high SVR (1,380) + cool extremities = preload-deficient state. The body compensates for low stroke volume by increasing SVR. The correct priority is volume resuscitation FIRST. Starting a vasopressor on a volume-depleted heart will increase afterload and further impair CO. Dopamine 'renal dosing' is not evidence-based. Diuresis would worsen the problem.",pearl:"\u{1F4CC} High SVR + low CI + low CVP = empty tank. The heart is squeezing against resistance but has nothing to squeeze. Fill first, then reassess.",escalation:"If CI remains <2.0 after adequate volume loading (CVP 8\u201312), consider adding an inotrope (milrinone or dobutamine) and notify the cardiac surgery team."},{id:"L2-02",category:"Complications",scenario:"Post-op AVR (for severe AS), 6 hrs. MAP 55, HR 105, CVP 18, PAP 42/22, PCWP 20, CI 1.5, SVR 1,500. Skin cool and mottled. Lactate 3.8 mmol/L. UOP <15 mL/hr. BiPAP initiated post-extubation.",question:"This hemodynamic profile is MOST consistent with:",options:["A. Vasoplegic shock \u2014 start norepinephrine","B. Low cardiac output syndrome / cardiogenic shock \u2014 optimize inotropy","C. Hypovolemia \u2014 aggressive fluid resuscitation","D. RV failure \u2014 start inhaled nitric oxide"],answer:"B",rationale:"Classic cardiogenic/low cardiac output syndrome (LCOS): CI <2.0, elevated filling pressures (CVP 18, PCWP 20), high SVR (body compensating), lactate elevation, cool mottled skin. In AVR for severe AS, the hypertrophied LV may be stiff and slow to recover (diastolic dysfunction). This patient needs inotropic support \u2014 milrinone or dobutamine. Vasoplegia shows low SVR, warm skin. Hypovolemia shows low CVP. RV failure shows RV dilation, high CVP, low PCWP.",pearl:"\u{1F4CC} Post-AVR for AS: the thick hypertrophied LV is stiff post-bypass. Expect diastolic dysfunction. They need heart rate optimization and may need inotropes early.",escalation:"If CI <1.8 despite inotropes \u2192 IABP or Impella discussion with cardiac surgery. Goal CI >2.2, lactate trending down, MAP >65."},{id:"L2-03",category:"Complications",scenario:"Post-op CABG, 8 hrs. Patient successfully extubated. New onset: HR 130 (AF), MAP 58 suddenly dropping. CVP was 8 now rapidly climbing to 20 over 30 minutes. Chest tube output stopped. Patient anxious, diaphoretic. Muffled heart sounds on auscultation.",question:"Your FIRST action should be:",options:["A. Cardiovert the AF immediately","B. Give 1L fluid bolus and reassess","C. Notify cardiac surgery surgeon STAT \u2014 suspect tamponade","D. Start norepinephrine to support MAP"],answer:"C",rationale:"This is tamponade physiology: rising CVP + falling MAP + cessation of chest tube drainage + muffled heart sounds. The classic 'Beck's triad' in post-op form. Tamponade is a SURGICAL emergency requiring immediate intervention. Cardioverting AF first delays definitive treatment. Fluids may temporarily buy time but are not treatment. Pressors increase afterload without fixing the mechanical obstruction. Call surgery immediately.",pearl:"\u{1F4CC} Rising CVP + falling MAP + stopped chest tubes = tamponade. Time from recognition to surgeon at bedside should be <5 minutes. Open crash cart. Prepare for possible bedside sternotomy.",escalation:"STAT surgeon notification. Prepare OR. If patient loses pulse \u2192 CPR + immediate bedside chest reopening per protocol."},{id:"L2-04",category:"Hemodynamics",scenario:"Post-op CABG, 18 hrs. MAP 58, HR 95, CVP 6, CI 3.2, SVR 480. Temperature 37.8\xB0C. Skin warm and flushed. Vasopressin 0.03 units/min and norepinephrine 0.08 mcg/kg/min both running.",question:"This hemodynamic pattern is MOST consistent with:",options:["A. Cardiogenic shock \u2014 add inotrope","B. Vasoplegic shock \u2014 optimize vasopressor therapy","C. Hypovolemia \u2014 increase fluids","D. Septic shock \u2014 obtain blood cultures"],answer:"B",rationale:"Classic vasoplegia: HIGH CI (3.2) + LOW SVR (480) + LOW MAP + warm flushed skin. The heart is pumping vigorously, but the vascular tone is gone \u2014 systemic inflammatory response from bypass (SIRS). The patient is already on 2 vasopressors. Consider adding methylene blue (1.5 mg/kg) if refractory to dual vasopressors. CI >2.2 means the pump is fine. This is a pipes problem, not a pump problem.",pearl:"\u{1F4CC} Vasoplegia: CI normal/high + SVR low + warm skin. 'Pump is fine, pipes are broken.' Vasopressors are the treatment. Methylene blue for refractory cases. Do not give inotropes.",escalation:"If MAP <60 on vasopressin + norepinephrine \u2192 consider methylene blue or angiotensin II. Notify attending/surgeon. Check for adrenal insufficiency (hydrocortisone 200 mg/day)."},{id:"L2-05",category:"Complications",scenario:"Post-op MVR + TV repair, 10 hrs. MAP 65, HR 100, CVP 18, CI 1.9, PA pressures 52/28. PCWP 14. Right ventricle appears markedly dilated on bedside echo. Increasing O2 requirements (FiO2 now 60% on HFNC).",question:"Which intervention is MOST appropriate for this patient's hemodynamic picture?",options:["A. Aggressive fluid boluses to improve preload","B. Start milrinone + inhaled pulmonary vasodilator (iNO or epoprostenol)","C. Start norepinephrine for low CI","D. Emergent IABP placement"],answer:"B",rationale:"RV failure post-cardiac surgery: HIGH CVP (18) + low PCWP (14) = the RV is struggling against elevated pulmonary pressures, causing RV dilation and reduced output. Milrinone reduces PVR AND improves RV contractility (inovasodilator). Inhaled NO or epoprostenol selectively reduces PVR without systemic hypotension. Fluids would overdistend the already-failing RV. Norepinephrine increases RV afterload. IABP helps LV, not RV.",pearl:"\u{1F4CC} RV failure signs: CVP >> PCWP, RV dilation on echo, elevated PA pressures. Avoid fluids. Use milrinone + inhaled pulmonary vasodilators. The RV is pressure-sensitive \u2014 unload it.",escalation:"If RV failure refractory to milrinone + iNO \u2192 RVAD discussion, VA-ECMO, or Impella RP. Involve cardiac surgery and critical care immediately."},{id:"L2-06",category:"Routine Post-Op",scenario:"Post-op CABG, 14 hrs. Patient extubated 4 hrs ago. Now: HR 52 with occasional pauses, MAP 62, CVP 9. 12-lead: sinus bradycardia with 3-second sinus pauses. Epicardial pacing wires in place (atrial and ventricular). Patient feels lightheaded.",question:"What is the MOST appropriate management?",options:["A. Atropine 0.5 mg IV push immediately","B. Activate epicardial pacing wires \u2014 VVI mode at 70 bpm","C. Start dopamine infusion for chronotropy","D. Prepare for transvenous pacemaker insertion"],answer:"B",rationale:"Epicardial pacing wires placed intraoperatively are the safest, fastest intervention for post-op bradycardia with pauses and symptoms. VVI mode at 70 bpm will provide immediate rate support. Atropine can be used but epicardial wires are the preferred method with faster effect. Dopamine is an option but pacing is more reliable. Transvenous pacemaker is unnecessary when epicardial wires are in place.",pearl:"\u{1F4CC} Always know the epicardial pacing wire status at the start of your shift. Test thresholds daily. They are your safety net for post-op conduction disturbances \u2014 use them.",escalation:"If loss of capture despite appropriate settings \u2192 check connections, increase mA output. If wires non-functional \u2192 STAT cardiology for transvenous pacemaker."},{id:"L2-07",category:"Hemodynamics",scenario:"Post-op Bentall procedure (aortic root replacement), 20 hrs. MAP 82, HR 88, CVP 10, CI 2.6. Receiving sodium nitroprusside (SNP) 1 mcg/kg/min. SBP 148. Incision appears intact. No evidence of tamponade.",question:"Why is tight blood pressure control (SBP <130) critical in this patient specifically?",options:["A. To prevent post-op atrial fibrillation","B. To reduce tension on fresh aortic anastomoses and prevent catastrophic dehiscence or bleeding","C. To allow weaning of SNP within 12 hours","D. To protect newly grafted coronary vessels"],answer:"B",rationale:"In aortic root/arch surgery (Bentall, TAAA repair, hemi-arch), the suture lines on the fresh anastomoses are at direct risk from elevated blood pressure. Hypertension dramatically increases wall tension (LaPlace's law) on these repairs and can cause dehiscence, pseudoaneurysm formation, or catastrophic bleeding. SBP goal is typically <120\u2013130 mmHg. This is the most critical blood pressure management priority in aortic surgery.",pearl:"\u{1F4CC} After aortic surgery: BP control is non-negotiable. SBP target usually <130 (some centers <120). SNP or nicardipine are first-line. Uncontrolled hypertension = suture line at risk.",escalation:"SBP >140 despite SNP \u2192 increase SNP dose, add esmolol or nicardipine. Notify surgery. If >160 \u2192 urgent surgical notification."}],3:[{id:"L3-01",category:"Advanced Hemodynamics",scenario:"Post-op CABG \xD7 5 + MVR, 6 hrs. IABP 1:1. MAP 58 despite: norepinephrine 0.15 mcg/kg/min, vasopressin 0.04 units/min, milrinone 0.375 mcg/kg/min. CI 1.6. CVP 22. PCWP 26. Lactate 6.2 and rising. UOP <10 mL/hr. Skin cold, mottled, dusky.",question:"This patient is in refractory cardiogenic shock. As the charge RN, your IMMEDIATE priority is:",options:["A. Increase norepinephrine to 0.3 mcg/kg/min and recheck CI in 1 hour","B. Add epinephrine infusion for combined inotropic/vasopressor effect","C. Activate MCS escalation \u2014 contact cardiac surgery for VA-ECMO or Impella 5.5 discussion STAT","D. Optimize IABP timing and add dobutamine"],answer:"C",rationale:"This patient meets criteria for refractory cardiogenic shock despite maximal medical therapy (3 vasopressors + inotrope + IABP). Rising lactate (6.2), falling UOP, CI 1.6 with high filling pressures = end-organ failure in progress. The evidence base for early MCS escalation (VA-ECMO or Impella 5.5) before multiorgan failure is established. Delay worsens outcomes. As charge nurse, your role is to escalate rapidly. Adding more pressors/inotropes delays definitive intervention.",pearl:"\u{1F4CC} Refractory cardiogenic shock: when 2 vasopressors + inotrope + IABP fail to achieve CI >2.0 and lactate is rising \u2192 MCS escalation time. Early implantation before multiorgan failure = better outcomes.",escalation:"STAT cardiac surgery. Activate cath lab / ECMO team if applicable. Document time of recognition. Goal: MCS device in place before lactate exceeds 8\u201310 or irreversible end-organ damage."},{id:"L3-02",category:"Mixed Shock States",scenario:"Post-op CABG, 36 hrs. Patient was doing well, then rapid deterioration: T 39.2\xB0C, HR 126 (AF), MAP 55, CVP 14, CI 3.8, SVR 420. WBC 18.2, procalcitonin 12.4. Sternal wound edges mildly erythematous. SpO2 88% on 6L NC. On: vasopressin 0.04 + norepinephrine 0.12 mcg/kg/min.",question:"This presentation is MOST consistent with \u2014 and what must be ruled out URGENTLY?",options:["A. Late vasoplegic shock from bypass SIRS \u2014 continue current vasopressors","B. Septic shock \u2014 likely mediastinitis or sternal wound infection \u2014 obtain cultures, start broad-spectrum antibiotics, urgent surgical evaluation","C. Post-op AF with hemodynamic compromise \u2014 cardiovert immediately","D. Pulmonary embolism \u2014 start anticoagulation"],answer:"B",rationale:"Late deterioration at 36 hours with fever, leukocytosis, elevated procalcitonin, wound changes, and septic hemodynamics (high CI + low SVR) in a post-cardiac surgery patient = mediastinitis/sternal wound infection until proven otherwise. This is a surgical emergency \u2014 mortality from mediastinitis post-sternotomy is 15\u201340%. Source control (surgical debridement) is critical alongside antibiotics. Simple vasoplegia from bypass typically peaks at 12\u201324 hrs and improves. AF is a component but not the primary driver.",pearl:"\u{1F4CC} New fever + sternal wound changes + septic hemodynamics at 24\u201372 hrs post-CABG = mediastinitis alarm. Don't attribute deterioration to 'late SIRS' without examining the sternum and obtaining cultures. Missed mediastinitis = catastrophic outcome.",escalation:"Blood cultures \xD7 2, wound cultures, stat CT chest with contrast (if stable). Start vancomycin + pip-tazo empirically. Immediate surgical evaluation for possible return to OR."},{id:"L3-03",category:"RV Failure + MCS",scenario:"Post-op orthotopic heart transplant, 8 hrs. Recipient had severe pre-existing pulmonary hypertension (PVR 6 WU pre-transplant). Now: MAP 60, CVP 26, PA 68/38, CI 1.4, PCWP 10. Donor heart RV visibly strained on TEE. On: epinephrine 0.1, milrinone 0.5, vasopressin 0.04, inhaled nitric oxide 20 ppm. Escalating FiO2 requirements.",question:"As charge nurse, you recognize this as severe primary graft dysfunction with RV failure. Beyond calling the transplant team, what clinical framework guides your nursing management?",options:["A. Aggressive fluids to raise CVP >30, start dopamine, discontinue iNO (may cause rebound)","B. Avoid volume, maintain current iNO, ensure milrinone is at goal, optimize oxygenation and ventilation to minimize PVR \u2014 prepare for RVAD or VA-ECMO discussion","C. Focus on rate control of any dysrhythmia; bradycardia worsens RV failure more than any other factor","D. Titrate norepinephrine aggressively to maintain MAP >80 for coronary perfusion"],answer:"B",rationale:"Primary graft dysfunction (PGD) with RV failure in orthotopic heart transplant is life-threatening. Management pillars: (1) Avoid fluid overload \u2014 already CVP 26, more volume overdistends failing RV. (2) Continue/optimize pulmonary vasodilators (iNO, epoprostenol) to reduce RV afterload. (3) Milrinone: inovasodilates \u2014 reduces PVR and supports RV contractility. (4) Optimize ventilation: hyperventilation + FiO2 to minimize hypoxic pulmonary vasoconstriction. (5) Prepare for mechanical support: RVAD or VA-ECMO. Norepinephrine increases systemic and pulmonary afterload. Fluids worsen the problem.",pearl:"\u{1F4CC} RV failure in PGD: minimize PVR (iNO, hyperventilate, maximize O2), avoid volume overload, use milrinone as inovasodilator, prepare for mechanical RV support. The RV is all pressure \u2014 don't load it, unload it.",escalation:"Contact transplant surgery and pulmonary hypertension team. Activate ECMO team. Bedside echo every 2 hrs to monitor RV function. Goal: bridge to recovery or RVAD if CI remains <1.5."},{id:"L3-04",category:"Advanced Hemodynamics",scenario:"Post-op CABG, 48 hrs. Impella CP placed for pre-op cardiogenic shock, still running at P8. MAP 72, CI 3.1 (Impella-supported), HR 88. Surgeon asks you to begin Impella weaning. You reduce to P6: MAP drops to 60, HR increases to 108, lactate rises from 1.8 to 2.4 within 30 minutes.",question:"How do you interpret this weaning trial and what is your next action?",options:["A. Continue weaning \u2014 the patient simply needs time to adjust to reduced support","B. The patient has failed the wean trial \u2014 return to P8, document findings, and notify cardiac surgery and cardiology for reassessment","C. Give a 500 mL fluid bolus before reassessing wean tolerance","D. Switch to P4 and recheck in 2 hours"],answer:"B",rationale:"This patient failed Impella weaning: MAP dropped 12 points, compensatory tachycardia developed, and lactate rose \u2014 indicating inadequate native cardiac output without full device support. Returning to P8 is the correct, immediate response. Continuing to wean despite hemodynamic deterioration and rising lactate risks decompensation. Notify the cardiac surgery/cardiology team for reassessment. Further weaning attempts should be protocol-guided after optimization (vasopressors, recovery time, repeat echo).",pearl:"\u{1F4CC} Impella wean failure criteria: >10 mmHg MAP drop, tachycardia, rising lactate, or UOP decline within 30\u201360 min of support reduction. Return to previous level immediately \u2014 don't push through failure signs.",escalation:"Return to P8. Notify cardiac surgery and attending. Consider repeat echo to assess native LV function. Discuss alternative strategies: staged wean protocol, LVAD bridge, or retransplant evaluation."},{id:"L3-05",category:"Complex Scenarios",scenario:"Post-op CABG, 72 hrs. Doing well, being prepared for step-down. Suddenly: HR 168 wide complex tachycardia, BP 72/40. Patient barely responsive, diaphoretic, pale. No palpable pulse initially, then faint pulse returns on palpation.",question:"Your immediate sequential management steps are:",options:["A. 12-lead ECG \u2192 call cardiologist \u2192 antiarrhythmic infusion \u2192 reassess","B. Confirm pulse \u2192 defibrillate 200J if pulseless, or synchronized cardiovert 200J if pulse present \u2192 crash cart, ACLS, STAT surgical and cardiology notification","C. Amiodarone 150 mg IV push \u2192 reassess rhythm \u2192 prepare for cardioversion if no response","D. Adenosine 6 mg IV \u2192 if no response \u2192 adenosine 12 mg \u2192 reassess"],answer:"B",rationale:"Hemodynamically unstable wide complex tachycardia with near-syncope/altered consciousness = immediate electrical therapy. (1) Confirm pulse: if absent \u2192 defibrillate 200J immediately (VF/pVT). If pulse present \u2192 synchronized cardiovert 200J. (2) Crash cart, continuous monitoring, airway ready. (3) STAT notify cardiac surgery (patient is 72 hrs post-CABG \u2014 ischemia, reperfusion VT, suture line issues). (4) After cardioversion \u2192 amiodarone 150 mg bolus then 1 mg/min infusion. Amiodarone first delays electrical therapy. Adenosine is for SVT, contraindicated in WCT of unknown origin.",pearl:"\u{1F4CC} Unstable WCT = electricity first, drugs second. In post-cardiac surgery patients, WCT is VT until proven otherwise. Adenosine has no role in hemodynamically unstable WCT. Shock, then stabilize.",escalation:"Post-cardioversion: amiodarone infusion, 12-lead, troponin, electrolytes, urgent cardiology + cardiac surgery notification. Return to OR may be needed if ischemic VT from graft failure."},{id:"L3-06",category:"Charge Nurse Decision",scenario:"Your CVICU has 8 beds, all occupied. You have 4 nurses. Two nurses have post-op patients (2 hrs from OR) requiring 1:1 care. One nurse has an Impella CP patient requiring continuous monitoring. Your 4th nurse calls out sick at shift start. You have: 1 step-down nurse who can float, 1 ICU resource nurse with limited CVICU experience, and an administrator offering to arrange agency (3-hr ETA).",question:"As charge nurse, what is your MOST appropriate immediate priority action?",options:["A. Wait for agency \u2014 3 hours is manageable with current staff stretched","B. Immediately assess acuity of all 8 patients, temporarily care for critical patients yourself, assign the step-down float to most stable patients, brief the resource nurse on CVICU protocols, and escalate to house supervisor and nursing leadership immediately","C. Ask the two post-op nurses to each take an extra patient temporarily","D. Discharge the most stable patient to step-down to reduce nurse-to-patient ratio"],answer:"B",rationale:"This is a staffing crisis with critical care patients. Correct charge nurse actions: (1) Immediate patient acuity stratification \u2014 identify who needs 1:1 vs can tolerate brief monitoring lapses. (2) Temporarily provide direct care for highest-acuity patients yourself while organizing coverage. (3) Float step-down nurse to MOST stable CVICU patients (low acuity, stable hemodynamics). (4) Brief resource nurse with CVICU-specific caveats \u2014 do NOT leave unsupported. (5) Immediately escalate to house supervisor and nursing director \u2014 document your staffing concern. Waiting 3 hours is unsafe. Post-op nurses adding patients violates safe ratios. Patient transfers are possible but cannot be rushed.",pearl:"\u{1F4CC} Charge nurse priority in crisis: assess \u2192 stabilize \u2192 escalate \u2192 document. You cannot fix a staffing crisis alone \u2014 escalate immediately and formally. Your escalation creates the paper trail that protects staff and patients.",escalation:"Document all staffing concerns in writing (Shift Assessment, SBAR to supervisor). If unsafe conditions persist \u2192 escalate to CNO/administrator. Your documentation matters legally and ethically."}]},Vi=[...dr[1],...dr[2],...dr[3]],cr={1:{label:"Foundations",color:"#22c55e",bg:"rgba(34,197,94,0.12)",border:"rgba(34,197,94,0.4)",desc:"New to CVICU / Refresher"},2:{label:"Core Clinical",color:"#f59e0b",bg:"rgba(245,158,11,0.12)",border:"rgba(245,158,11,0.4)",desc:"Competent CVICU RN"},3:{label:"Advanced",color:"#ef4444",bg:"rgba(239,68,68,0.12)",border:"rgba(239,68,68,0.4)",desc:"Charge Nurse Level"}},Wc={Hemodynamics:"\u{1F4CA}",Compli
