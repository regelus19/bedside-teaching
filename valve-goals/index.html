Patient will often arrive volume overloaded from chronic MS. IV diuretics needed post-op, but avoid over-diuresis."},{param:"PA Pressure",target:"Trending down",note:"The more significant the pre-op pulmonary HTN, the greater the likelihood of post-op RV failure."}],rvRisk:"HIGH \u2014 Longstanding pulmonary HTN from MS creates an RV that has adapted to pressure overload. Sudden relief of LA obstruction + SIRS post-bypass can trigger acute RV decompensation.",keyRisks:[{label:"RV Failure",detail:"Most significant risk. Pre-op PA pressures predict post-op RV vulnerability.",severity:"high"},{label:"Volume Overload",detail:"Chronically elevated PCWP causes fluid retention. Expect need for IV diuretics post-op.",severity:"med"},{label:"Ventricular Ectopy",detail:"Expect ventricular ectopy post-op. Important to use AV pacing when needed.",severity:"med"},{label:"AF",detail:"Aggressive rate/rhythm management required. Loss of atrial kick is particularly damaging in MS physiology \u2014 the LV depends on sinus rhythm and AV synchrony for adequate filling.",severity:"med"}],fluids:"In MS, the LV is often underfilled pre-op due to obstruction \u2014 not volume-overloaded. After MVR, the LV may actually need adequate filling to generate forward CO. Use small, careful boluses guided by CI and echo response, not PCWP alone. Avoid both under-resuscitation (underfilled LV post-obstruction-relief) and over-resuscitation (risks pulmonary edema from residual pulmonary HTN). Note: the 'minimal volume response' principle applies to chronic volume-overloaded lesions (MR, AR) \u2014 NOT to isolated MS.",pearl:"The RV in MS has been under pressure for years. After MVR, it's suddenly exposed to lower pulmonary resistance \u2014 but it may be too stiff and hypertrophied to adapt quickly. Watch PA pressures closely the first 12\u201324 hrs."},{id:"mr",label:"Mitral Regurgitation",short:"MR",icon:"\u{1F494}",color:"#a855f7",bg:"rgba(168,85,247,0.1)",border:"rgba(168,85,247,0.35)",subtitle:"Repair / MVR",overview:"Chronic MR volume-overloads both LA and LV. After repair, the LV loses its low-resistance escape route (regurgitant flow into LA). The LV must now pump entirely forward against systemic afterload \u2014 which can unmask underlying LV dysfunction.",earlyExpectation:"Low CO can occur after MR repair even among patients with grossly normal pre-op LV function. The PAWP may rise rapidly as the LV adapts to forward-only flow.",goals:[{param:"HR",target:"Avoid bradycardia; ~70\u201390",note:"In chronic volume-overloaded ventricles like MR, a rate slightly higher than the AS/MS target is generally better tolerated \u2014 shorter diastole reduces regurgitant fraction pre-repair and prevents LV over-distension post-repair. However, 80\u2013100 bpm should be seen as a starting range to individualize, not a target to push toward. Titrate to CI response."},{param:"Afterload",target:"Reduce SVR",note:"May require vasodilator therapy. Lower afterload helps the LV eject forward. Avoid alpha-agent-mediated vasoconstriction."},{param:"PCWP",target:"Monitor closely",note:"After repair, PCWP may rise rapidly \u2014 previously the LA was the 'overflow.' Now all LV output must go forward."},{param:"CI",target:"\u2265 2.2 L/min/m\xB2",note:"Low CO syndrome risk after MR repair even with preserved pre-op EF. Monitor closely."},{param:"Inotropy",target:"Support if CI < 2.0",note:"Milrinone preferred \u2014 provides inotropy + vasodilation simultaneously, reduces LV afterload."}],rvRisk:"MODERATE \u2014 Less severe than MS unless significant pre-op pulmonary HTN was present from chronic MR.",keyRisks:[{label:"LV Dysfunction Unmasked",detail:"After repair, LV loses low-resistance LA escape. True LV function is revealed. May require inotropes.",severity:"high"},{label:"Low CO Syndrome",detail:"LCOS can occur even with preserved pre-op EF. CI must be monitored post-repair.",severity:"high"},{label:"Afterload Mismatch",detail:"Similar mechanism to post-AVR AS: LV now fully exposed to systemic SVR it was partially offloading.",severity:"med"},{label:"Rapid PCWP Rise",detail:"LA filling suddenly encounters full LV output. Pulmonary edema risk if LV adapts slowly.",severity:"med"}],fluids:"Cautious fluid administration. Volume can precipitate pulmonary edema if LV is struggling with new afterload. Monitor PCWP with each bolus.",pearl:"Early surgery for MR generally reduces post-op physiologic disturbance. Late intervention is associated with poor ventricular function that may not recover after repair. Know your patient's pre-op trajectory."},{id:"as",label:"Aortic Stenosis",short:"AS",icon:"\u{1F512}",color:"#ef4444",bg:"rgba(239,68,68,0.1)",border:"rgba(239,68,68,0.35)",subtitle:"AVR (Surgical / TAVR)",overview:"Severe AS forces the LV to generate massive systolic pressure against a calcified pinhole. The LV responds with concentric hypertrophy. After AVR, the obstruction is gone \u2014 but the thick, stiff, non-compliant myocardium remains. The first hours post-op are defined by afterload mismatch and diastolic dysfunction.",earlyExpectation:"Expect diastolic dysfunction to dominate. The hypertrophied LV needs HIGH filling pressures to fill adequately, but is also vulnerable to pulmonary edema if over-filled. A narrow therapeutic window.",goals:[{param:"HR",target:"60\u201380 bpm",note:"Stiff LV needs time to fill. Tachycardia shortens diastole critically \u2014 the thick LV filling on a short interval fills very poorly. Target 60\u201380 firmly."},{param:"Rhythm",target:"NSR essential",note:"Atrial kick is crucial. AV synchrony maintains the atrial contribution to filling a stiff, non-compliant LV."},{param:"Filling Pressure",target:"Mid-to-high teens (titrate)",note:"The stiff, hypertrophied LV typically needs higher-than-normal filling pressures \u2014 often in the mid- to high-teen range \u2014 to generate adequate stroke volume. However, a rigid number is less useful than a trend: use CI and lung status to guide titration. Over-filling can cause pulmonary edema in fragile lungs, especially in elderly patients. PCWP may also overestimate true LVEDP in a non-compliant LV \u2014 echo adds critical context."},{param:"Afterload / SBP",target:"SBP ~90\u2013110 mmHg (typical range)",note:"Tight BP control post-AVR protects suture lines and reduces wall stress per LaPlace's law. Many programs use an SBP window in this range, but this should be individualized \u2014 follow your surgeon's specific orders. The LV also benefits from afterload reduction: vasodilators or milrinone improve ejection from a stiff ventricle. Balance BP protection with adequate organ perfusion."},{param:"MAP",target:"65\u201375 mmHg",note:"Adequate perfusion pressure for a hypertrophied LV with high myocardial oxygen demand. Avoid both hypotension and hypertension \u2014 the therapeutic window is narrow."}],rvRisk:"LOW-MODERATE \u2014 Unless severe pre-op pulmonary HTN was present. The primary concern is LV, not RV.",keyRisks:[{label:"Afterload Mismatch",detail:"The #1 post-AVR risk. Stiff LV exposed to SVR it was previously buffered from by the valve gradient.",severity:"high"},{label:"Diastolic Dysfunction",detail:"Hypertrophied LV relaxes poorly. Needs high filling pressures but is vulnerable to pulmonary edema.",severity:"high"},{label:"Heart Block / BBB",detail:"AV node injury during AVR can result in heart block. Bundle branch block following AVR is adverse prognostic significance. Pacing wires essential.",severity:"high"},{label:"LCOS",detail:"Low CI despite adequate filling = LCOS. Needs inotropes (milrinone preferred). Do not chase with fluids alone.",severity:"high"},{label:"LVOT Obstruction",detail:"Concentric hypertrophy creates dynamic LVOT obstruction risk \u2014 especially with tachycardia or hypovolemia. Avoid aggressive tachycardia management.",severity:"med"}],fluids:"Small, careful boluses. Stiff LV needs filling pressure but cannot tolerate volume overload. 250 mL aliquots, reassess PCWP after each. LV is 'more stiff' \u2014 pulmonary artery occlusion pressure may underestimate actual filling.",pearl:"The LV after AVR for severe AS is the classic afterload mismatch scenario. High SVR + CI < 2.0 = not a fluid problem. Give milrinone (inovasodilator), reduce afterload, keep HR 60\u201380. The LV remodels \u2014 but it takes weeks to months, not hours."},{id:"ar",label:"Aortic Regurgitation",short:"AR",icon:"\u{1F513}",color:"#f59e0b",bg:"rgba(245,158,11,0.1)",border:"rgba(245,158,11,0.35)",subtitle:"AVR for AR",overview:"Chronic AR volume-overloads the LV from both directions \u2014 antegrade from the aorta AND retrograde from the incompetent valve. LV dilates massively (eccentric hypertrophy). After AVR, the regurgitant volume is eliminated, but the dilated, remodeled LV must now handle significantly reduced preload.",earlyExpectation:"If LV enlargement was >50mm pre-op, significant dysfunction is expected in the post-op period. Early surgery for AR reduces these disturbances. Late intervention is associated with poor ventricular recovery.",goals:[{param:"HR",target:"Avoid bradycardia; ~70\u201390",note:"In volume-overloaded lesions like AR, bradycardia (allowing LV over-filling) is often more harmful than a somewhat faster rate. A rate in the 70\u201390 range tends to be a reasonable starting point. Tachycardia approaching 100 bpm may occasionally be useful as a tool in selected patients where LV over-distension is the problem \u2014 but frame this as a selective strategy, not a universal target. Always titrate to CI."},{param:"Afterload",target:"Reduce SVR \u2014 vasodilators",note:"Patient may remain vasodilated after surgery and require vasodilator therapy. The dilated LV benefits from afterload reduction. If vasodilation causes hypotension despite adequate CO, may require alpha-agent to maintain MAP."},{param:"Alpha-Agent",target:"If vasodilated + hypotensive",note:"May remain vasodilated post-surgery and require an alpha-agent (norepinephrine, vasopressin) to maintain MAP. This is distinct from LCOS \u2014 if CI is adequate but SVR is low, vasopressor is appropriate."},{param:"CI / CO",target:"\u2265 2.2 L/min/m\xB2",note:"Monitor for LCOS. Can occur even among patients with grossly normal LV function post-repair. LV dysfunction unmasked after surgery because LV can no longer unload to LA. Use milrinone early if CI remains low. IABP may be needed for refractory cases."},{param:"Volume",target:"Scrutinize each aliquot",note:"Cardiac index, CO, and filling pressures must be closely scrutinized to avoid both under- and over-resuscitation. In chronic volume-overloaded ventricles, BP and CI response to volume challenge serve as better guides than PCWP alone."}],rvRisk:"LOW \u2014 AR primarily LV pathology. RV concern only if pre-op pulmonary HTN was present.",keyRisks:[{label:"LV Dysfunction Unmasked",detail:"LV can no longer unload to LA via regurgitant flow. True LV function exposed. If LA enlargement >50mm pre-op, significant dysfunction is expected post-op.",severity:"high"},{label:"Low CO Syndrome + IABP Risk",detail:"LCOS can occur even in patients with apparently good pre-op LV function. CI monitoring essential. Inotropic support if acute AR or pre-op LV dysfunction. May need IABP.",severity:"high"},{label:"Vasodilation + Hemodynamic Instability",detail:"Patient may remain vasodilated after surgery. May require alpha-agent to maintain MAP. Distinguish from LCOS \u2014 check CI before adding vasopressor alone.",severity:"high"},{label:"Increased LV Wall Stress",detail:"Higher afterload post-op due to loss of regurgitant flow which leads to drop in stroke volume. LV now pumps entirely against systemic resistance.",severity:"med"},{label:"Late Presentation Consequences",detail:"Late intervention for chronic AR is likely to be associated with very poor post-op ventricular function. Recovery is slower and may be incomplete.",severity:"med"}],fluids:"Careful, individualized resuscitation. Cardiac index and filling pressures must be closely scrutinized to avoid both under- and over-resuscitation. Each aliquot of fluid must be reassessed.",pearl:"Early surgery for AR generally reduces gross post-op physiologic disturbances. Late intervention with chronic severe AR is likely to be associated with poor ventricular function. Know the timeline of the disease \u2014 it predicts the ICU course."},{id:"aortic",label:"Aortic Surgery",short:"Ao",icon:"\u{1FA78}",color:"#10b981",bg:"rgba(16,185,129,0.1)",border:"rgba(16,185,129,0.35)",subtitle:"Root / Arch / Ascending",overview:"Aortic reconstruction (Bentall, hemi-arch, TAAA) requires strict blood pressure management to protect fresh suture lines. Wall stress is directly proportional to blood pressure \u2014 elevated SBP risks anastomotic dehiscence, pseudoaneurysm, or catastrophic bleeding.",earlyExpectation:"BP management is the non-negotiable priority. Fresh aortic anastomoses cannot tolerate hypertension. Wall stress = (Pressure \xD7 Radius) / (2 \xD7 Wall Thickness) \u2014 every mmHg elevation matters.",goals:[{param:"SBP",target:"< 120\u2013130 mmHg",note:"STRICT. Keep SBP below target to prevent dissection or rupture of fresh aortic arch anastomosis. Note: this is distinct from post-AVR for AS (SBP 90\u2013110). Aortic reconstruction suture lines require tighter control \u2014 wall stress is higher with elevated BP per LaPlace's law."},{param:"HR",target:"60\u201380 bpm",note:"Reduces cardiac output and aortic wall pulsatile stress. Avoid tachycardia \u2014 increases mechanical stress on suture lines."},{param:"MAP",target:"65\u201380 mmHg",note:"Adequate cerebral and organ perfusion pressure, especially after deep hypothermic circulatory arrest (DHCA) cases."},{param:"Vasodilators",target:"SNP or Nicardipine first-line",note:"Sodium nitroprusside or nicardipine for acute BP control. Add esmolol or labetalol for rate-pressure product control."},{param:"Neuro Check",target:"Q1\u20132 hr monitoring",note:"Stroke risk elevated post-arch surgery. Assess neurologic status every 1\u20132 hrs post-extubation. New deficits = STAT imaging."}],rvRisk:"VARIABLE \u2014 Depends on degree of pre-op AR (if present) and bypass time. Long DHCA cases carry additional myocardial stunning risk.",keyRisks:[{label:"Anastomotic Bleeding / Dehiscence",detail:"Most critical risk. Elevated BP tears suture lines. SBP control is the single most important management priority.",severity:"high"},{label:"Neurologic Injury",detail:"Stroke or encephalopathy from aortic arch manipulation, emboli, or hypoperfusion during DHCA.",severity:"high"},{label:"Spinal Cord Ischemia",detail:"Risk in TAAA repair. Early paraplegia/paraparesis demands immediate BP optimization and possible CSF drainage.",severity:"high"},{label:"Renal Failure",detail:"Prolonged bypass and aortic cross-clamp time. Monitor Cr, UOP. Early CRRT if oliguria persists.",severity:"med"},{label:"Coagulopathy",detail:"Long bypass times consume clotting factors. Anticipate FFP, cryo, platelet administration.",severity:"med"}],fluids:"Standard post-bypass resuscitation. No special restriction unless severe LV dysfunction present. PCWP-guided volume management. Priority is BP control over fluid strategy.",pearl:"After aortic surgery: every BP spike is a surgical threat. SBP > 140 despite initial therapy = escalate aggressively, notify surgery. The suture line is the most fragile structure in the body during the first 24\u201348 hours."}],ta=[{id:"hr",label:"Heart Rate",icon:"\u{1F493}",color:"#ef4444",content:{headline:"Heart Rate Management \u2014 Universal Principles",sections:[{title:"Target Range \u2014 By Ventricle Type",body:"Pressure-overloaded ventricles (AS, MS): target 60\u201380 bpm firmly. Tachycardia is harmful \u2014 it shortens diastolic filling time in a stiff, non-compliant LV and increases myocardial oxygen demand in an already-hypertrophied myocardium. Volume-overloaded ventricles (MR, AR): a slightly higher rate in the 70\u201390 range is generally better tolerated. These numbers are starting points to titrate against CI and BP response, not rigid protocol targets."},{title:"Why Rate Matters in Valve Surgery",body:"Preoperative medications and the bypass period itself determine the heart rate arriving at the ICU. HR tolerance is narrow \u2014 wide fluctuations shorten diastolic filling time and compromise end-diastolic volume, thereby reducing cardiac output."},{title:"Tachycardia \u2014 Why It Worsens",body:"Acute tachyarrhythmias are usually only transient but actually worsen hemodynamics by: (1) Decreasing diastolic filling time. (2) Inducing arrhythmias. (3) Provoking LVOT obstruction in hypertrophied LVs. (4) Reducing atrial contribution to stiff ventricles. Rates > 75\u201380 bpm in AS/MS patients tend to be harmful."},{title:"Bradycardia",body:"Bradycardia is problematic and variable. AV node injury from AVR can produce heart block. The presence of bundle branch block following AVR is of adverse prognostic significance. Epicardial pacing wires (A&V) must be tested and ready at all times."},{title:"Atrial Kick \u2014 Non-Negotiable",body:"AFIB must be managed aggressively. Atrial kick is crucial for filling stiff, hypertrophied ventricles (AS post-AVR, MS). Sinus rhythm or dual-chamber pacing to maintain AV synchrony. Rate-responsive contractility (Bowditch reflex) may be blunted post-bypass."},{title:"Volume vs. Pressure Ventricle \u2014 The Rate Distinction",body:"For volume-overloaded ventricles (MR, AR): a rate below 75 bpm is often more deleterious than a rate around 80\u201390, because the over-distended ventricle empties better at slightly higher rates. Tachycardia approaching 100 bpm can sometimes be enlisted as a selective tool in these patients. For pressure-overloaded ventricles (AS, MS): the reverse is true \u2014 tachycardia is dangerous, shortening the critical diastolic filling window in a stiff, hypertrophied LV. Modern perioperative valve practice emphasizes moderate HR (roughly 60\u201380) for pressure-overloaded ventricles, avoiding tachycardia. Both statements are true: pressure ventricles dislike tachycardia; volume ventricles often tolerate it \u2014 but neither should be pushed toward 100 bpm as a standard goal."}]}},{id:"rv",label:"RV Failure",icon:"\u26A0\uFE0F",color:"#f59e0b",content:{headline:"Post-Valve RV Failure \u2014 Recognition & Management",sections:[{title:"Who Is At Risk",body:"The more significant the pre-op pulmonary hypertension, the greater the likelihood of post-op RV failure. Mitral stenosis patients carry the highest risk due to years of elevated LA pressure transmitted backwards into the pulmonary circulation."},{title:"Hemodynamic Signature",body:"CVP > PCWP gap widens. CVP rising with MAP falling. PA pressures elevated or not reducing as expected post-bypass. CI falling despite adequate preload. RV dilation on bedside echo."},{title:"Fluid Management in RV Failure",body:"AVOID fluid boluses \u2014 the dilated, pressure-overloaded RV cannot tolerate more volume. Over-distension causes septal shift leftward (D-sign on echo), which FURTHER impairs LV filling. The RV is a pressure-sensitive organ \u2014 unload it, don't fill it."},{title:"Pharmacologic Support",body:"Milrinone is the preferred agent \u2014 it is an inovasodilator that simultaneously improves RV contractility and reduces pulmonary vascular resistance. Inhaled NO or epoprostenol selectively reduces PVR without systemic hypotension. If systemic BP is low, vasopressin can maintain MAP without increasing PVR."},{title:"Ventilator Strategy",body:"Optimize oxygenation and ventilation to minimize hypoxic pulmonary vasoconstriction. High FiO\u2082, mild hyperventilation (reduce PaCO\u2082 to 35\u201338), PEEP titrated carefully \u2014 excessive PEEP increases RV afterload."},{title:"Escalation Threshold",body:"If CI < 1.8 despite milrinone + inhaled pulmonary vasodilator + optimized ventilation \u2192 RVAD or VA-ECMO discussion. Do not wait for multiorgan failure to develop before escalating."}]}},{id:"lcos",label:"Low CO Syndrome",icon:"\u{1F4C9}",color:"#6366f1",content:{headline:"Low Cardiac Output Syndrome (LCOS) \u2014 Post-Valve",sections:[{title:"Definition",body:"CI < 2.0\u20132.2 L/min/m\xB2 with signs of end-organ hypoperfusion: falling UOP, rising lactate, cool extremities, high SvO\u2082 extraction (SvO\u2082 < 60%). LCOS can occur after any valve surgery including patients with preserved pre-op LV function."},{title:"Vasodilator Therapy \u2014 First Consideration",body:"May require vasodilator therapy before inotropes in patients where the primary problem is high SVR impairing LV ejection. This is the afterload mismatch scenario \u2014 not a pump failure, a load problem. Nicardipine, NTG, or milrinone (which has both effects)."},{title:"When Alpha-Agents Are Needed",body:"If LCOS is accompanied by low SVR (vasoplegic component), an alpha-agent (norepinephrine, vasopressin) may be required to maintain MAP. But using vasopressors alone without addressing the underlying pump problem worsens LCOS by increasing LV afterload."},{title:"Milrinone \u2014 The Preferred Inotrope",body:"Milrinone is preferred over dobutamine in most post-valve LCOS because it simultaneously provides inotropy, reduces PVR, and reduces SVR (LV afterload). This triple effect is ideal for the stiff, afterload-sensitive post-valve LV."},{title:"Nitric Oxide / Prostacyclin",body:"If LV dysfunction is accompanied by RV failure or elevated PVR, inhaled nitric oxide or epoprostenol can be added. These selectively dilate pulmonary vasculature without causing systemic hypotension."},{title:"Escalation \u2014 MCS",body:"If CI < 1.8 despite milrinone + optimized vasopressors + IABP \u2192 MCS escalation (Impella, VA-ECMO). Early MCS before multiorgan failure = better outcomes. Rising lactate + falling UOP = do not wait."},{title:"Contractility Nadir \u2014 The 4\u20136 Hour Window",body:"Myocardial performance typically diminishes during the first 4\u20136 hours in the ICU, then rapidly returns to baseline or supra-baseline within 24 hours. The maximum diminution in function approximates 10\u201315% of baseline EF. Knowing this timeline is essential: early LCOS may be a transient nadir, not a permanent state \u2014 but it still requires active support during that window."},{title:"Predictors of Depressed Post-Op Contractility",body:"Key contributors to depressed post-op contractility that must be assessed at ICU arrival: (1) Pre-op EF \u2264 35% \u2014 baseline dysfunction predicts poor post-bypass recovery. (2) Hypothermia on arrival \u2014 patients arriving at \u2264 35\xB0C have significantly impaired contractility; allow rewarming before making inotrope escalation decisions. (3) Bypass time > 120 minutes \u2014 prolonged CPB time correlates with myocardial stunning. Review the OR note for intra-op TEE findings and inotropic agents required to come off bypass."}]}},{id:"pacing",label:"Pacing",icon:"\u26A1",color:"#22c55e",content:{headline:"Epicardial Pacing \u2014 Post-Valve Surgery",sections:[{title:"Why Pacing Wires Are Critical",body:"Surgical trauma near the AV node during valve surgery \u2014 especially AVR and MVR \u2014 can produce transient or permanent conduction disturbances. Epicardial A and V wires must be tested at the start of every shift."},{title:"AV Node Injury \u2014 AVR",body:"Aortic valve surgery risks AV node injury \u2014 which can result in complete heart block. The presence of a new bundle branch block following AVR is of adverse prognostic significance. Any new conduction defect must be taken seriously."},{title:"Dual-Chamber Pacing Preferred",body:"AV synchrony is critical for patients with stiff, hypertrophied LVs (AS post-AVR, MS post-MVR). DDD mode (dual-chamber sensing and pacing) maintains the atrial contribution to filling. VVI alone loses atrial kick."},{title:"When To Pace",body:"HR < 60 with symptoms (lightheadedness, hypotension, signs of low CO). Pauses > 2 seconds. New complete heart block post-AVR. Refractory bradycardia to atropine. Always have wires ready \u2014 test thresholds daily."},{title:"AF After Valve Surgery",body:"Post-operative AF occurs in 20\u201340% of valve surgery patients. Rate control vs rhythm control depends on hemodynamic stability. Synchronized cardioversion if MAP < 60 or hemodynamically unstable. Keep K > 4.0, Mg > 2.0."},{title:"LVOT Obstruction Risk",body:"In hypertrophied LVs (post-AS), tachycardia and excessive inotropy can provoke dynamic LVOT obstruction. Avoid overly aggressive heart rate increases. TEE can identify this risk intraoperatively and guide post-op management."}]}},{id:"tee",label:"TEE / Echo",icon:"\u{1F50A}",color:"#06b6d4",content:{headline:"Intraoperative & Post-Op Echocardiography",sections:[{title:"TEE Role Post-Valve Surgery",body:"Transesophageal echocardiography performed by a skilled echocardiographer is a critical tool in post-valve surgery hemodynamic management. Requires specialized skill. Bedside TTE is the first-line assessment tool in the CVICU."},{title:"What to Assess on Echo",body:"RV size and function (dilation, septal shift). LV systolic function (EF, regional wall motion). Filling patterns (diastolic dysfunction grade). Valvular function (residual regurgitation, gradient). Pericardial effusion / tamponade. Volume status (IVC collapsibility)."},{title:"First 4\u20136 Hours",body:"The initial post-op period (first 4\u20136 hours) shows rapid changes in hemodynamics as the patient warms, vasodilates, and alterations in the relationship between filling pressures and volumes evolve. Echo provides real-time guidance during this period."},{title:"Estimating Filling Pressures Post-Valve",body:"After valve repair, filling pressure measurements must be scrutinized carefully. The LV is often more stiff \u2014 pulmonary artery occlusion pressure may be relatively higher than the actual LV end-diastolic pressure. Volume decisions should incorporate echo findings, not pressure numbers alone."},{title:"TEE for Unexplained Hemodynamic Deterioration",body:"Any unexplained hemodynamic deterioration post-valve surgery should trigger a bedside echo assessment before empiric interventions: (1) Rule out tamponade. (2) Assess RV function. (3) Evaluate for residual valve problem. (4) Check for LVOT obstruction."}]}}];function Cf({level:e}){let t={high:{color:"#ef4444",bg:"rgba(239,68,68,0.12)",label:"HIGH"},med:{color:"#f59e0b",bg:"rgba(245,158,11,0.1)",label:"MOD"},low:{color:"#22c55e",bg:"rgba(34,197,94,0.1)",label:"LOW"}}[e]||{color:"#64748b",bg:"rgba(100,116,139,0.1)",label:e.toUpperCase()};return(0,c.jsx)("span",{style:{padding:"2px 7px",borderRadius:3,fontSize:9,fontWeight:700,letterSpacing:1.5,fontFamily:"monospace",background:t.bg,color:t.color,border:`1px solid ${t.color}33`,flexShrink:0},children:t.label})}function xf({param:e,target:t,note:n,color:r}){let[i,o]=(0,j.useState)(!1);return(0,c.jsxs)("div",{style:{borderBottom:"1px solid #1e293b"},children:[(0,c.jsxs)("div",{onClick:()=>o(l=>!l),style:{display:"flex",alignItems:"center",gap:10,padding:"10px 14px",cursor:"pointer",transition:"background 0.15s"},onMouseEnter:l=>l.currentTarget.style.background="rgba(255,255,255,0.03)",onMouseLeave:l=>l.currentTarget.style.background="transparent",children:[(0,c.jsx)("div",{style:{width:6,height:6,borderRadius:"50%",background:r,flexShrink:0}}),(0,c.jsxs)("div",{style:{flex:1,display:"flex",justifyContent:"space-between",alignItems:"center",gap:8,flexWrap:"wrap"},children:[(0,c.jsx)("span",{style:{fontSize:12,fontWeight:700,color:"#cbd5e1",fontFamily:"monospace",letterSpacing:1},children:e}),(0,c.jsx)("span",{style:{fontSize:12,color:r,fontFamily:"monospace",fontWeight:600},children:t})]}),(0,c.jsx)("span",{style:{fontSize:12,color:"#475569",transition:"transform 0.2s",transform:i?"rotate(90deg)":"none"},children:"\u25B6"})]}),i&&(0,c.jsx)("div",{style:{padding:"0 14px 12px 30px",fontSize:12,color:"#94a3b8",lineHeight:1.65,animation:"fadeIn 0.2s ease"},child tom:10},children:"\u{1F4A1} BEDSIDE PEARL"}),(0,c.jsxs)("p",{style:{fontSize:13,color:"#d4e4f7",lineHeight:1.85,margin:0,fontStyle:"italic"},children:["\u201C",e.pearl,"\u201D"]})]})})]})]})}var sr=[{id:"q01",valve:"AS",difficulty:1,scenario:"Post-op AVR for severe AS, 3 hrs from OR. HR 102, MAP 68, PCWP 20, CI 2.0. Patient shivering. Pacing wires in place.",question:"The elevated HR of 102 is most concerning because:",options:["A. It increases myocardial oxygen demand in an ischemic heart","B. It shortens diastolic filling time in a stiff, non-compliant LV \u2014 directly reducing end-diastolic volume and CI","C. It may provoke atrial fibrillation","D. It raises MAP beyond safe limits for the aortic anastomosis"],answer:"B",rationale:"The hypertrophied, non-compliant LV post-AVR for AS is exquisitely sensitive to diastolic filling time. Tachycardia shortens the window for the stiff ventricle to fill \u2014 directly reducing EDV and stroke volume. The document states: 'When heart rate is excessive, the time for preloading the ventricle may shorten sufficiently to compromise end-diastolic volume and thus cardiac output.' Target is 60\u201380 bpm firmly.",pearl:"\u{1F4CC} Post-AVR for AS: tachycardia is not just uncomfortable \u2014 it mechanically starves a stiff LV of filling time. Treat it aggressively."},{id:"q02",valve:"AS",difficulty:2,scenario:"Post-op AVR (severe AS), 5 hrs. MAP 62, HR 78, CI 1.7, PCWP 22, SVR 1,450. Patient arrived from OR at 34.8\xB0C. Still rewarming.",question:"CI is 1.7 despite adequate filling pressures. Before escalating to inotropes, what is the most important contextual factor to consider?",options:["A. PCWP of 22 suggests volume overload \u2014 give furosemide","B. Patient arrived hypothermic at 34.8\xB0C \u2014 depressed contractility may be transient; allow rewarming before escalating inotropes","C. SVR of 1,450 is the primary problem \u2014 start nicardipine immediately","D. CI < 2.0 always requires immediate milrinone regardless of context"],answer:"B",rationale:"Hypothermia on arrival (\u226435\xB0C) is a key contributor to depressed post-op contractility. Bypass time >120 mins and pre-op EF \u226435% are the other two. Myocardial performance typically diminishes in the first 4\u20136 hrs then returns to baseline within 24 hrs \u2014 with maximum diminution ~10\u201315% of baseline EF. Escalating inotropes before allowing rewarming may overcorrect a transient state. Reassess CI as temperature normalizes.",pearl:"\u{1F4CC} Three predictors of post-op LCOS to always check: arrival temp \u226435\xB0C, bypass time >120 min, pre-op EF \u226435%. Context before escalation."},{id:"q03",valve:"AS",difficulty:2,scenario:"Post-op AVR, 6 hrs. MAP 58, HR 76 (NSR), CI 1.8, PCWP 20. SBP 88. Surgeon asks you to maintain SBP 90\u2013110.",question:"Why is the SBP target specifically 90\u2013110 mmHg (not higher) after AVR for severe AS?",options:["A. Higher SBP increases risk of post-op AF","B. To prevent dissection or rupture \u2014 the aortic arch is at risk from elevated wall stress even at the valve suture lines","C. Hypertension worsens diastolic dysfunction","D. Higher SBP increases risk of LVOT obstruction from the hypertrophied septum"],answer:"B",rationale:"The document states explicitly: 'Hypertension control. Keep SBP between 90\u2013110 to prevent dissection/rupture of aortic arch.' This is distinct from general afterload mismatch management \u2014 it's a structural protection target for the fresh aortic valve and annular repair. Wall stress follows LaPlace's law \u2014 higher pressure = higher suture-line tension.",pearl:"\u{1F4CC} SBP 90\u2013110 post-AVR isn't just about the LV \u2014 it protects the aortic root and repair from mechanical failure."},{id:"q04",valve:"AS",difficulty:3,scenario:"Post-op AVR (severe AS, pre-op EF 35%), 4 hrs. Bypass time was 148 minutes. Arrival temp 34.6\xB0C. Now: CI 1.6, PCWP 21, MAP 60, SVR 1,600, HR 72 NSR. Lactate 2.8 and rising. Patient is at 36.1\xB0C now.",question:"All three high-risk contractility predictors are present. CI remains 1.6 after rewarming. What is the most appropriate next step?",options:["A. Continue observation \u2014 the 4\u20136 hour nadir hasn't passed yet","B. Give 500 mL fluid bolus \u2014 PCWP of 21 is not high enough","C. Initiate milrinone \u2014 rising lactate with CI 1.6 after rewarming = true LCOS requiring inovasodilator support","D. Start norepinephrine for MAP support before adding inotrope"],answer:"C",rationale:"All three high-risk predictors were present (pre-op EF \u226435%, bypass >120 min, arrival temp \u226435\xB0C). Patient has rewarmed to 36.1\xB0C \u2014 the transient hypothermic component has resolved. Lactate is rising = progressive tissue oxygen debt. This is true LCOS, not a transient nadir. Milrinone is the preferred agent \u2014 inovasodilator that improves contractility AND reduces SVR (afterload), perfect for the stiff post-AS LV. Norepinephrine alone would worsen LV ejection.",pearl:"\u{1F4CC} When all three risk predictors are present AND lactate rises despite rewarming \u2014 stop watching, start treating. Milrinone first."},{id:"q05",valve:"MS",difficulty:1,scenario:"Post-op MVR for severe MS. PA pressures pre-op were 58/32. Now 4 hrs post-op: CVP 22, PCWP 14, CI 1.9, MAP 62, PA 48/28. RV appears dilated on bedside echo.",question:"This hemodynamic pattern \u2014 high CVP, relatively low PCWP, elevated PA pressures, low CI \u2014 is most consistent with:",options:["A. Cardiac tamponade \u2014 call surgery","B. Post-op RV failure from longstanding pulmonary HTN","C. Hypovolemia \u2014 give fluid bolus","D. LV afterload mismatch \u2014 start milrinone"],answer:"B",rationale:"CVP >> PCWP with elevated PA pressures and RV dilation on echo = RV failure. In MS, longstanding pulmonary HTN from obstructed LV filling creates a chronically pressure-loaded RV. The document states: 'The more significant the pulmonary HTN, the greater the likelihood of post-op RV failure.' Pre-op PA 58/32 is a clear warning sign. Fluids would further distend the failing RV \u2014 avoid.",pearl:"\u{1F4CC} In MS: always check pre-op PA pressures. High PA pre-op = high RV failure risk post-MVR. CVP >> PCWP = RV in trouble."},{id:"q06",valve:"MS",difficulty:2,scenario:"Post-op MVR for MS, 8 hrs. Patient has been given 2L of crystalloid for low UOP. Now: CVP 24, PCWP 26, CI 1.7, PA 52/34, MAP 60. UOP remains low. Echo: RV severely dilated, septal shift (D-sign).",question:"What does the D-sign on echo indicate, and what is the correct intervention?",options:["A. LV volume overload \u2014 start diuresis","B. RV pressure overload causing septal shift into LV, impairing LV filling \u2014 STOP fluids, start milrinone + inhaled pulmonary vasodilator","C. Cardiac tamponade with RV compression \u2014 call surgery","D. Normal post-bypass finding \u2014 continue monitoring"],answer:"B",rationale:"The D-sign (flattening/leftward shift of the interventricular septum) means the RV is so pressure/volume overloaded that it is mechanically encroaching on LV filling \u2014 a lethal cycle. Further fluids worsen this. Management: STOP volume, milrinone (inovasodilator reduces PVR + improves RV contractility), inhaled NO or epoprostenol for selective pulmonary vasodilation. The 2L of fluids given for low UOP almost certainly worsened this patient.",pearl:"\u{1F4CC} D-sign = the RV is crushing the LV. Fluids are poison here. Milrinone + iNO to unload the RV is the target."},{id:"q07",valve:"MR",difficulty:1,scenario:"Post-op MVR for chronic severe MR, 3 hrs. Pre-op EF was 62%. Now: CI 1.9, PCWP 24, MAP 65, SVR 1,100, HR 88. No signs of vasoplegia. Surgeon is surprised by the low CI given preserved pre-op EF.",question:"Why can CI be low after MVR for MR even when pre-op EF was preserved?",options:["A. The bypass circuit always causes myocardial stunning regardless of pre-op function","B. After repair, the LV loses its low-resistance escape route to the LA \u2014 it must now eject entirely against systemic SVR, unmasking true LV dysfunction","C. The new mitral prosthesis obstructs LV filling","D. Preserved EF pre-op always means normal CI post-op \u2014 something else must explain this"],answer:"B",rationale:"This is the MR unmasking phenomenon. Pre-op, the MR allowed the LV to offload regurgitant volume into the LA \u2014 artificially preserving EF by reducing effective afterload. After repair, the LV must eject 100% forward against systemic SVR. The document states explicitly: 'LV dysfunction and low cardiac output frequently occur after repair even among patients with grossly normal LV function. LV dysfunction is unmasked after surgery because LV can't unload to LA.'",pearl:"\u{1F4CC} Pre-op EF in MR is a lie. The LV was cheating by dumping into the LA. After repair, the true EF is revealed. Expect LCOS even with 'normal' function."},{id:"q08",valve:"MR",difficulty:2,scenario:"Post-op MVR repair for MR. LA was measured at 54mm pre-op. Now post-op, patient is in sinus rhythm with HR 72. Surgeon notes the rhythm may not hold.",question:"Given the LA size of 54mm, what rhythm management issue should you specifically anticipate and prepare for?",options:["A. Ventricular tachycardia from surgical trauma near the papillary muscles","B. If LA enlargement >50mm, it is very unlikely to maintain NSR in the post-op period \u2014 prepare for AF with AV pacing and antiarrhythmics","C. Complete heart block from mitral annular calcification","D. Junctional bradycardia from sinus node injury"],answer:"B",rationale:"The document states directly: 'If left atrial enlargement >50mm, it is very unlikely to maintain NSR in the post-op period.' LA of 54mm exceeds this threshold. Anticipate AF despite current NSR. Plan: AV pacing wires ready, antiarrhythmics at bedside, rate control strategy planned. Atrial kick in the post-MR repair period is important \u2014 prepare dual-chamber pacing if AF occurs.",pearl:"\u{1F4CC} LA > 50mm = NSR is fragile post-MVR. This isn't a surprise event \u2014 it's an expected finding. Be ready before it happens."},{id:"q09",valve:"AR",difficulty:2,scenario:"Post-op AVR for severe AR, 6 hrs. MAP 56, HR 88, CI 2.4, SVR 480. Skin warm, extremities vasodilated. Chest tubes draining minimal. Patient is hemodynamically warm and vasodilated despite CI being maintained.",question:"This post-AR hemodynamic pattern (adequate CI, low SVR, low MAP) is best explained by \u2014 and what intervention is most appropriate?",options:["A. LCOS \u2014 start milrinone for inotropic support","B. Vasoplegia from bypass SIRS \u2014 the patient may remain vasodilated after surgery and require an alpha-agent","C. Cardiac tamponade \u2014 call surgery","D. Hypovolemia \u2014 give 500 mL bolus"],answer:"B",rationale:"CI is 2.4 \u2014 the pump is working. The problem is vascular tone. The document specifically states for AR: 'May remain vasodilated after surgery and require alpha-agent.' This is vasodilation, not pump failure. With CI > 2.2 and low SVR causing low MAP, a vasopressor (norepinephrine or vasopressin) is the correct intervention \u2014 not an inotrope. Inotropes in this scenario would cause unnecessary tachycardia without addressing the SVR problem.",pearl:"\u{1F4CC} Post-AR: always distinguish LCOS (low CI + high SVR) from vasodilation (normal CI + low SVR). The intervention is opposite."},{id:"q10",valve:"AR",difficulty:3,scenario:"Post-op AVR for chronic AR, pre-op EF 42%, LA enlargement 48mm. Bypass time 130 min. Arrival temp 35.2\xB0C. Intraop TEE showed moderate LV dysfunction after coming off bypass. Now 3 hrs post-op: CI 1.6, PCWP 22, MAP 58, HR 90.",question:"This patient has multiple risk factors for LCOS. Ordering milrinone, the fellow suggests targeting CI > 2.2. As charge nurse, what additional intervention does the document specifically identify for refractory post-AR LCOS?",options:["A. Inhaled nitric oxide for pulmonary vasodilation","B. IABP \u2014 specifically named in the AR section for refractory LCOS with pre-op LV dysfunction","C. Vasopressin to restore MAP before starting inotropes","D. Emergent re-exploration for residual AR"],answer:"B",rationale:"The document states for AR contractility: 'Inotropic support if acute AR or pre-op LV dysfunction. May need IABP.' IABP is specifically named as a next step for refractory post-AR LCOS \u2014 it augments diastolic coronary filling (improves myocardial perfusion), reduces systolic afterload (helps LV eject), and is particularly beneficial when pre-op LV function was already compromised. This patient checks all three high-risk boxes: bypass >120 min, arrival \u226435\xB0C, pre-op EF 42% with intraop dysfunction.",pearl:"\u{1F4CC} Post-AR LCOS with pre-op dysfunction that doesn't respond to inotropes = IABP discussion. It's in the document. Know the escalation path."},{id:"q11",valve:"cross",difficulty:1,scenario:"You are admitting a post-op MVR patient. Charge nurse asks you to check the epicardial pacing wires. You test the ventricular wire \u2014 capture threshold is 3.2 mA at current output of 5 mA. The atrial wire fails to capture at maximum output.",question:"What is your most important immediate action regarding rhythm management?",options:["A. Document findings and reassess in 2 hours","B. Notify the physician immediately \u2014 loss of atrial pacing = loss of AV synchrony, which is critical for stiff LVs; prepare for VVI backup and dysrhythmia management","C. Increase the atrial output to 10 mA and recheck","D. Non-functional atrial wires are common \u2014 ventricular backup is sufficient"],answer:"B",rationale:"AV synchrony is critical for patients with stiff, hypertrophied ventricles. The document states: 'When compliance is significantly diminished, synchronized atrioventricular contraction plays a more significant role in ensuring maximal preload.' Loss of atrial pacing = loss of atrial kick = reduced CO in a non-compliant post-valve LV. Non-functional atrial wires are not routine \u2014 notify the physician immediately. VVI backup maintains rate but loses the 15\u201325% CO contribution of atrial kick.",pearl:"\u{1F4CC} Atrial pacing wires aren't optional post-valve surgery for stiff LVs. AV synchrony = atrial kick = 15\u201325% of CO. Protect it."},{id:"q12",valve:"cross",difficulty:2,scenario:"Post-op MVR, 5 hrs. Patient volume-overloaded from chronic MS. CI 2.1, PCWP 28, MAP 68. You give 250 mL fluid bolus. CI improves to 2.3, PCWP rises to 30, MAP rises to 72.",question:"In a volume-overloaded ventricle (post-MR/AR), how does the response to a fluid challenge differ from a pressure-overloaded ventricle (post-AS/MS)?",options:["A. No difference \u2014 PCWP and CI both respond equally in all post-valve patients","B. In chronically volume-overloaded ventricles, BP and CI may improve remarkably before filling pressures change \u2014 PCWP is insensitive and unreliable as a sole guide","C. Volume-overloaded ventricles never respond to fluid boluses post-surgery","D. Pressure-overloaded ventricles tolerate fluids better because they have thicker walls"],answer:"B",rationale:"The document makes this distinction explicitly: 'In the chronically volume-overloaded ventricle, the blood pressure and CI response to volume challenge serve as better guides of adequate preload because the pulmonary artery occlusion pressure and pulmonary artery pressure are insensitive except at the extremes.' This patient's CI improving from 2.1 to 2.3 before a large PCWP change is the expected response in a volume-overloaded ventricle. In contrast, pressure-overloaded ventricles (AS, MS) may see rapid PCWP rises with minimal volume \u2014 a narrow therapeutic window.",pearl:"\u{1F4CC} Volume-overloaded LV: CI and BP respond before filling pressures change. Pressure-overloaded LV: PCWP climbs fast with minimal volume. Know which patient you have."},{id:"q13",valve:"cross",difficulty:3,scenario:"Post-op patient from MVR + CABG, bypass time 155 min, arrival temp 34.5\xB0C, pre-op EF 38%. Now 4.5 hrs post-op: CI 1.7, rising to 1.9 over 30 min as patient warms. MAP 64. Lactate 2.1, stable. UOP adequate.",question:"Understanding the contractility nadir timeline, what is the most clinically sound interpretation and management approach?",options:["A. CI of 1.7\u20131.9 is severely abnormal \u2014 start milrinone and vasopressin immediately","B. This patient has all three high-risk predictors. However, CI is trending UP as the patient rewarns, lactate is stable, UOP is adequate \u2014 this may represent the expected nadir. Continue warming, trend CI, hold inotrope escalation unless trajectory reverses","C. CI < 2.0 is always an indication for immediate IABP in high-risk patients","D. The 4\u20136 hour nadir rule only applies to patients with normal pre-op EF"],answer:"B",rationale:"All three high-risk predictors are present, but CI is trending upward \u2014 exactly what the timeline predicts. The document states myocardial performance diminishes first 4\u20136 hrs then rapidly returns to baseline within 24 hrs (max 10\u201315% EF drop). With stable lactate, adequate UOP, and an improving trend, this represents the expected nadir, not true LCOS requiring immediate escalation. The critical nuance: if CI stops improving or reverses, or if lactate rises \u2014 that's when you act. Trending up = reassuring. Trending down = escalate.",pearl:"\u{1F4CC} The 4\u20136 hr nadir is a real physiologic phenomenon. Trend matters more than a single number. CI improving + stable lactate = watch closely. CI declining + rising lactate = act now."}],Pf=[{key:"all",label:"All Questions",color:"#3b82f6"},{key:"AS",label:"Aortic Stenosis",color:"#ef4444"},{key:"MS",label:"Mitral Stenosis",color:"#3b82f6"},{key:"MR",label:"Mitral Regurg.",color:"#a855f7"},{key:"AR",label:"Aortic Regurg.",color:"#f59e0b"},{key:"cross",label:"Cross-Cutting",color:"#22c55e"}];function Rf({isMobile:e=!1}){let[t,n]=(0,j.useState)("all"),[r,i]=(0,j.useState)([]),[o,l]=(0,j.useState)(0),[a,s]
